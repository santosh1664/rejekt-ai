<!doctype html>
<!-- Test form shaped like a Lever /apply page: full name, urls[...] fields,
     "Resume/CV ✱" with the star mid-label, a custom radio question, and a
     hidden hCaptcha frame that only shows on a challenge. -->
<html><head><meta charset="utf-8"><title>Testco - Data Engineer</title></head><body>
<form method="post" action="/lever/submit" enctype="multipart/form-data">
  <div class="application-question"><label><div class="application-label">Resume/CV <span class="required">✱</span></div>
    <div class="application-field"><span>ATTACH RESUME/CV</span><input type="file" name="resume" style="opacity:0;position:absolute;width:1px;height:1px"></div></label></div>
  <div class="application-question"><label><div class="application-label">Full name <span class="required">✱</span></div><div class="application-field"><input name="name" type="text" required></div></label></div>
  <div class="application-question"><label><div class="application-label">Email <span class="required">✱</span></div><div class="application-field"><input name="email" type="email" required></div></label></div>
  <div class="application-question"><label><div class="application-label">Phone</div><div class="application-field"><input name="phone" type="text"></div></label></div>
  <div class="application-question"><label><div class="application-label">Current location</div><div class="application-field"><input name="location" type="text"></div></label></div>
  <div class="application-question"><label><div class="application-label">Current company</div><div class="application-field"><input name="org" type="text"></div></label></div>
  <div class="application-question"><label><div class="application-label">LinkedIn URL</div><div class="application-field"><input name="urls[LinkedIn]" type="text"></div></label></div>
  <div class="application-question"><label><div class="application-label">GitHub URL</div><div class="application-field"><input name="urls[GitHub]" type="text"></div></label></div>
  <div class="application-question custom-question"><div class="application-label">Will you now or in the future require visa sponsorship? <span class="required">✱</span></div>
    <ul class="application-field"><li><label><input type="radio" name="cards[q1][field0]" value="Yes" required> Yes</label></li>
      <li><label><input type="radio" name="cards[q1][field0]" value="No"> No</label></li></ul></div>
  <div class="application-question custom-question"><div class="application-label">Are you 18 years of age or older? <span class="required">✱</span></div>
    <ul class="application-field"><li><label><input type="radio" name="cards[q2][field0]" value="Yes" required> Yes</label></li>
      <li><label><input type="radio" name="cards[q2][field0]" value="No"> No</label></li></ul></div>
  <button type="submit" class="template-btn-submit">SUBMIT APPLICATION</button>
</form>
<iframe title="Widget containing checkbox for hCaptcha security challenge" src="/hcaptcha.com/captcha/v1/x#frame=checkbox" style="visibility:hidden" width="773" height="860"></iframe>
</body></html>
