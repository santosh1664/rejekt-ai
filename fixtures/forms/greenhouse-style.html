<!doctype html>
<!-- Test form shaped like a Greenhouse job-boards form: label[for] + asterisks,
     uploads labelled "Attach", React-select-style dropdowns (role=combobox +
     aria-controls listbox), a location typeahead, an invisible reCAPTCHA frame. -->
<html><head><meta charset="utf-8"><title>Job Application for Backend Engineer at Testco</title>
<style>.listbox{border:1px solid #ccc}.listbox [role=option]{padding:4px;cursor:pointer}</style></head>
<body>
<h1>Backend Engineer</h1>
<form id="application-form" method="post" action="/greenhouse/submit" enctype="multipart/form-data">
  <div><label for="first_name">First Name<span>*</span></label><input id="first_name" name="first_name" required></div>
  <div><label for="last_name">Last Name<span>*</span></label><input id="last_name" name="last_name" required></div>
  <div><label for="email">Email<span>*</span></label><input id="email" name="email" type="text" required></div>
  <div><label for="phone">Phone<span>*</span></label><input id="phone" name="phone" type="tel"></div>
  <div><label for="candidate-location">Location (City)<span>*</span></label>
    <input id="candidate-location" role="combobox" aria-autocomplete="list" autocomplete="off">
    <input type="hidden" name="location" id="location_value"></div>
  <div><div>Resume/CV<span>*</span></div><label for="resume">Attach</label><input id="resume" name="resume" type="file" style="display:none"></div>
  <div><div>Cover Letter</div><label for="cover_letter">Attach</label><input id="cover_letter" name="cover_letter" type="file" style="display:none"></div>
  <div><label for="question_1">LinkedIn Profile<span>*</span></label><input id="question_1" name="question_1" required></div>
  <div class="select"><label for="question_2">Are you legally authorized to work in the United States for Testco?<span>*</span></label>
    <input id="question_2" class="select__input" role="combobox" aria-expanded="false" autocomplete="off" data-options="Yes|No">
    <input type="hidden" name="question_2" id="question_2_value"></div>
  <div class="select"><label for="question_3">Do you now, or will you in the future, require sponsorship for employment to work legally in the United States?<span>*</span></label>
    <input id="question_3" class="select__input" role="combobox" aria-expanded="false" autocomplete="off" data-options="Yes|No">
    <input type="hidden" name="question_3" id="question_3_value"></div>
  <div class="select"><label for="gender">Gender</label>
    <input id="gender" class="select__input" role="combobox" aria-expanded="false" autocomplete="off" data-options="Male|Female|Decline To Self Identify">
    <input type="hidden" name="gender" id="gender_value"></div>
  <div class="select"><label for="veteran_status">Veteran Status</label>
    <input id="veteran_status" class="select__input" role="combobox" aria-expanded="false" autocomplete="off" data-options="I am not a protected veteran|I identify as one or more of the classifications of protected veteran|I don't wish to answer">
    <input type="hidden" name="veteran_status" id="veteran_status_value"></div>
  <div><label for="question_4">What kinds of SDK libraries have you built or maintained?<span>*</span></label><textarea id="question_4" name="question_4" required></textarea></div>
  <button type="submit">Submit application</button>
</form>
<iframe title="reCAPTCHA" src="/recaptcha/enterprise/anchor?ar=1&k=test&size=invisible" width="256" height="60"></iframe>
<script>
  const CITIES = ['Dallas, Texas, United States', 'Dallas, Georgia, United States', 'Austin, Texas, United States'];
  function openList(input, items) {
    closeAll();
    const lb = document.createElement('div');
    lb.className = 'listbox'; lb.setAttribute('role', 'listbox'); lb.id = 'listbox-' + input.id;
    items.forEach(t => {
      const o = document.createElement('div'); o.setAttribute('role', 'option'); o.textContent = t;
      o.addEventListener('mousedown', e => { e.preventDefault(); input.value = t; document.getElementById((input.id === 'candidate-location' ? 'location' : input.id) + '_value').value = t; closeAll(); });
      lb.appendChild(o);
    });
    input.parentElement.appendChild(lb);
    input.setAttribute('aria-controls', lb.id); input.setAttribute('aria-expanded', 'true');
  }
  function closeAll() {
    document.querySelectorAll('.listbox').forEach(l => l.remove());
    document.querySelectorAll('[role=combobox]').forEach(i => { i.removeAttribute('aria-controls'); i.setAttribute('aria-expanded', 'false'); });
  }
  document.querySelectorAll('.select__input').forEach(input => {
    input.addEventListener('mousedown', () => { input.getAttribute('aria-expanded') === 'true' ? closeAll() : openList(input, input.dataset.options.split('|')); });
    input.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });
  });
  const loc = document.getElementById('candidate-location');
  loc.addEventListener('input', () => { const v = loc.value.toLowerCase(); v.length > 1 ? openList(loc, CITIES.filter(c => c.toLowerCase().startsWith(v))) : closeAll(); });
  loc.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });
  document.getElementById('application-form').addEventListener('submit', e => {
    for (const id of ['question_2', 'question_3', 'location']) if (!document.getElementById(id + '_value').value) { e.preventDefault(); alert('missing ' + id); }
  });
</script>
</body></html>
