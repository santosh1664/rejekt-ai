<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin · Rejekt.ai</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Cpath d='M8 22h16M8 16h10M8 10h13' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
:root {
  --paper: #FFFFFF; --surface: #FFFFFF; --surface-2: #F6F6F5; --ink: #111111; --ink-2: #3B3B3B; --muted: #6A6A6A;
  --line: #DEDEDC; --line-2: #EBEBE9; --cobalt: #17382B; --cobalt-ink: #FFFFFF; --cobalt-soft: #EAF1EC;
  --ok: #2A8057; --ok-soft: #F2FAF5; --warn: #92650A; --warn-soft: #FFFAEB; --bad: #B84A3E; --bad-soft: #FFF5F3; --info: #3D5FCB; --info-soft: #F4F8FF;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --paper: #0E0E0E; --surface: #161616; --surface-2: #1E1E1E; --ink: #F2F2F2; --ink-2: #CFCFCF; --muted: #9A9A9A;
  --line: #2C2C2C; --line-2: #232323; --cobalt: #F2F2F2; --cobalt-ink: #111111; --cobalt-soft: #262626;
  --ok: #6FD3A0; --ok-soft: #14261D; --warn: #E9C46A; --warn-soft: #2E2812; --bad: #F2948A; --bad-soft: #2E1A17; --info: #9DB6F5; --info-soft: #172036; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-2); color: var(--ink); font: 14px/1.5 'Schibsted Grotesk', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
nav { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; }
nav .logo { height: 20px; width: auto; align-self: flex-start; margin: 0 8px 4px; } nav .tag { margin: 0 8px 18px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.logo-dark { display: none; } @media (prefers-color-scheme: dark) { .logo-light { display: none; } .logo-dark { display: block; } }
nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; text-decoration: none; color: var(--ink-2); font-weight: 500; }
nav a:hover { background: var(--surface-2); } nav a[aria-current="page"] { background: var(--cobalt-soft); color: var(--ink); font-weight: 600; }
nav a .count { margin-left: auto; font-size: 12px; background: var(--bad-soft); color: var(--bad); border-radius: 99px; padding: 0 7px; font-weight: 600; }
nav .foot { margin-top: auto; display: grid; gap: 2px; border-top: 1px solid var(--line-2); padding-top: 10px; }
nav .who { padding: 4px 10px; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
main { padding: 28px 32px 60px; max-width: 1240px; width: 100%; }
h1 { font-size: 22px; letter-spacing: -0.015em; margin: 0 0 4px; } h2 { font-size: 15px; margin: 0 0 12px; }
.sub { color: var(--muted); margin: 0 0 22px; }
.grid { display: grid; gap: 14px; } .kpis { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-bottom: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.kpi .n { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; } .kpi .l { color: var(--muted); font-size: 13px; }
.kpi .s { font-size: 12px; color: var(--muted); }
.two { grid-template-columns: 1.4fr 1fr; align-items: start; } @media (max-width: 1000px) { .two { grid-template-columns: 1fr; } }
table { width: 100%; border-collapse: collapse; } th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
.tablewrap { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: auto; }
.tablewrap table td:first-child, .tablewrap table th:first-child { padding-left: 16px; }
.muted { color: var(--muted); } .mono { font-family: var(--mono); font-size: 12px; } .small { font-size: 12px; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); } .badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); } .badge.info { background: var(--info-soft); color: var(--info); }
.btn { font: inherit; font-weight: 600; font-size: 13px; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-block; }
.btn:hover { background: var(--surface-2); } .btn.primary { background: var(--cobalt); color: var(--cobalt-ink); border-color: transparent; }
.btn.danger { color: var(--bad); border-color: var(--bad-soft); } .btn[disabled] { opacity: .55; cursor: progress; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
input, select { font: inherit; padding: 8px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); }
input[type=search] { min-width: 280px; }
.att { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line-2); } .att:last-child { border-bottom: 0; }
.att .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; } .att .dot.bad { background: var(--bad); } .att .dot.warn { background: var(--warn); }
.att .t { flex: 1; }
.empty { padding: 26px; text-align: center; color: var(--muted); }
dl { display: grid; grid-template-columns: 170px 1fr; gap: 6px 14px; margin: 0; } dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
pre { font-family: var(--mono); font-size: 12px; background: var(--surface-2); padding: 12px; border-radius: 10px; overflow: auto; max-height: 360px; margin: 0; white-space: pre-wrap; }
.timeline { display: grid; gap: 8px; } .timeline div { border-left: 2px solid var(--line); padding-left: 10px; }
.back { display: inline-block; margin-bottom: 10px; color: var(--muted); text-decoration: none; } .back:hover { color: var(--ink); }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-weight: 500; z-index: 100; max-width: 90vw; }
.toast.bad { background: var(--bad); color: #fff; }
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 20px; background: var(--surface); color: var(--ink); max-width: 460px; width: 92vw; }
dialog::backdrop { background: rgb(0 0 0 / .35); } dialog h3 { margin: 0 0 8px; font-size: 16px; } dialog p { margin: 0 0 16px; color: var(--ink-2); }
dialog .actions { justify-content: flex-end; }
.linkbox { display: flex; gap: 8px; margin-top: 10px; } .linkbox input { flex: 1; font-family: var(--mono); font-size: 12px; }
.loading { color: var(--muted); padding: 30px 0; }
@media (max-width: 760px) { .shell { grid-template-columns: 1fr; } nav { position: static; height: auto; flex-direction: row; flex-wrap: wrap; } nav .logo, nav .tag, nav .foot { display: none; } main { padding: 18px; } }
</style>
</head>
<body>
<div class="shell">
  <nav aria-label="Admin">
    <img class="logo logo-light" src="/brand/rejekt-logo.png" alt="Rejekt.ai"><img class="logo logo-dark" src="/brand/rejekt-logo-dark.png" alt="Rejekt.ai">
    <div class="tag">Admin</div>
    <a href="#/" data-nav="overview">Overview <span class="count" id="navAttention" hidden></span></a>
    <a href="#/users" data-nav="users">Users</a>
    <a href="#/applications" data-nav="applications">Applications</a>
    <a href="#/companies" data-nav="companies">Companies &amp; jobs</a>
    <a href="#/scans" data-nav="scans">Scans</a>
    <a href="#/invites" data-nav="invites">Invites</a>
    <a href="#/system" data-nav="system">System</a>
    <a href="#/audit" data-nav="audit">Audit log</a>
    <div class="foot">
      <a href="#" id="logout">Log out</a>
      <div class="who" id="who"></div>
    </div>
  </nav>
  <main id="view" tabindex="-1"><div class="loading">Loading…</div></main>
</div>
<dialog id="confirm"><h3 id="cTitle"></h3><p id="cText"></p><div class="actions"><button class="btn" value="no" id="cNo">Cancel</button><button class="btn primary" id="cYes">Confirm</button></div></dialog>
<dialog id="linkDlg"><h3>Password reset link</h3><p id="linkText"></p><div class="linkbox"><input id="linkVal" readonly><button class="btn primary" id="linkCopy">Copy</button></div><div class="actions" style="margin-top:14px"><button class="btn" id="linkClose">Done</button></div></dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const view = $('#view');

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  if (res.status === 401) { location.assign('/login?next=' + encodeURIComponent('/admin' + location.hash)); throw new Error('Log in again'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || data.message || `Request failed (${res.status})`);
  return data;
}
function toast(msg, bad = false) {
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 4500);
}
function confirmBox(title, text, yes = 'Confirm', danger = false) {
  const d = $('#confirm'); $('#cTitle').textContent = title; $('#cText').textContent = text; $('#cYes').textContent = yes;
  $('#cYes').className = 'btn ' + (danger ? 'danger' : 'primary');
  return new Promise(ok => {
    const done = (v) => { d.close(); $('#cYes').onclick = $('#cNo').onclick = null; ok(v); };
    $('#cYes').onclick = () => done(true); $('#cNo').onclick = () => done(false); d.oncancel = () => done(false);
    d.showModal();
  });
}
// Run an action button: optional confirm, disable while running, toast the result, then refresh
async function act(btn, fn, { confirm, then } = {}) {
  if (confirm && !(await confirmBox(...confirm))) return;
  btn.disabled = true;
  try { const r = await fn(); if (r?.message) toast(r.message); if (then) await then(r); else await route(); }
  catch (e) { toast(e.message, true); }
  finally { btn.disabled = false; }
}

const when = (d) => d ? new Date(d).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '–';
function ago(d) {
  if (!d) return 'never'; const s = (Date.now() - new Date(d)) / 1000;
  if (s < 60) return 'just now'; if (s < 3600) return `${Math.round(s / 60)} min ago`; if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  return `${Math.round(s / 86400)} d ago`;
}
const STATE = { SUBMITTED: 'ok', APPLIED: 'ok', NEEDS_YOU: 'warn', PREPARED: 'info', QUEUED: 'info', SUBMITTING: 'info', FAILED: 'bad', SKIPPED: '', SAVED: '', REJECTED: 'bad', STUCK: 'bad' };
const PRETTY = { NEEDS_YOU: 'Needs you', SUBMITTED: 'Submitted', FAILED: 'Failed', PREPARED: 'Ready to send', QUEUED: 'Queued', SUBMITTING: 'Sending', SKIPPED: 'Skipped', SAVED: 'Saved', APPLIED: 'Applied', REJECTED: 'Rejected', STUCK: 'Stuck' };
const badge = (state) => `<span class="badge ${STATE[state] ?? ''}">${esc(PRETTY[state] || state || '–')}</span>`;
const appState = (a) => a.apply_state || a.status;

// ─── Router ─────────────────────────────────────────────────────────────────
const ROUTES = [
  [/^\/?$/, 'overview', renderOverview], [/^\/users$/, 'users', renderUsers], [/^\/users\/([\w-]+)$/, 'users', renderUser],
  [/^\/applications$/, 'applications', renderApps], [/^\/applications\/(\d+)$/, 'applications', renderApp],
  [/^\/companies$/, 'companies', renderCompanies], [/^\/scans$/, 'scans', renderScans], [/^\/invites$/, 'invites', renderInvites],
  [/^\/system$/, 'system', renderSystem], [/^\/audit$/, 'audit', renderAudit],
];
let seq = 0, pollers = [];   // pages that refresh themselves (Scans) register their timers here
async function route() {
  pollers.forEach(clearInterval); pollers = [];
  const [path, qs] = location.hash.slice(1).split('?');
  const params = new URLSearchParams(qs || '');
  const hit = ROUTES.find(([re]) => re.test(path || '/')) || ROUTES[0];
  $$('nav a[data-nav]').forEach(a => a.dataset.nav === hit[1] ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  const mine = ++seq;
  try {
    const html = await hit[2](...((path || '/').match(hit[0]) || []).slice(1), params);
    if (mine !== seq) return;
    if (html != null) view.innerHTML = html;
    hit[2].after?.(params);
  } catch (e) { if (mine === seq) view.innerHTML = `<div class="card"><b>Couldn't load this page.</b><p class="muted">${esc(e.message)}</p><button class="btn" onclick="route()">Try again</button></div>`; }
}
window.addEventListener('hashchange', () => { view.innerHTML = '<div class="loading">Loading…</div>'; route(); });

// ─── Overview ───────────────────────────────────────────────────────────────
async function renderOverview() {
  const o = await api('GET', '/admin/api/overview');
  const n = (st) => o.states.find(s => s.state === st)?.n || 0;
  const nav = $('#navAttention'); nav.hidden = !o.attention.length; nav.textContent = o.attention.length;
  const kpi = (num, label, sub = '') => `<div class="card kpi"><div class="n">${num}</div><div class="l">${label}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>`;
  return `
    <h1>Overview</h1><p class="sub">${o.scanning ? 'A scan is running now.' : `Next scan ${o.schedule?.nextAt ? when(o.schedule.nextAt) : 'not scheduled'}.`}</p>
    <div class="grid kpis">
      ${kpi(o.users.total, 'Users', `${o.users.active7d} active this week${o.users.disabled ? ` · ${o.users.disabled} disabled` : ''}`)}
      ${kpi((o.jobs?.active ?? 0).toLocaleString(), 'Open jobs', `${(o.jobs?.total ?? 0).toLocaleString()} ever found`)}
      ${kpi(o.submittedToday, 'Sent in 24 h')}
      ${kpi(n('NEEDS_YOU'), 'Waiting on users')}
      ${kpi(n('FAILED'), 'Failed')}
      ${kpi(o.stuck, 'Stuck')}
      ${kpi(o.pendingInvites, 'Pending invites')}
    </div>
    <div class="grid two">
      <div class="card"><h2>Needs attention</h2>
        ${o.attention.length ? o.attention.map((a, i) => `<div class="att"><span class="dot ${a.level}"></span><span class="t">${esc(a.text)}</span>
          ${a.fix ? `<button class="btn" data-fix="${a.fix}">${esc(a.fixLabel)}</button>` : `<a class="btn" href="${a.link}">${esc(a.fixLabel)}</a>`}</div>`).join('')
          : '<div class="empty">Nothing needs you right now.</div>'}
      </div>
      <div class="card"><h2>Applications by state</h2>
        <table><tbody>${o.states.map(s => `<tr class="click" data-href="#/applications?state=${encodeURIComponent(s.state)}"><td>${badge(s.state)}</td><td style="text-align:right">${s.n}</td></tr>`).join('') || '<tr><td class="muted">None yet</td></tr>'}</tbody></table>
      </div>
    </div>
    <div class="card" style="margin-top:14px"><h2>Recent scan runs</h2>
      <table><thead><tr><th>Run</th><th>Started</th><th>Took</th><th>Status</th><th>Companies</th><th>Errors</th><th>New jobs</th><th>Closed</th></tr></thead><tbody>
      ${o.runs.map(r => `<tr><td class="mono">#${r.id}</td><td>${when(r.started_at)}</td><td>${r.finished_at ? Math.round((new Date(r.finished_at) - new Date(r.started_at)) / 60000) + ' min' : '–'}</td>
        <td><span class="badge ${{ completed: 'ok', failed: 'bad', running: 'info' }[r.status] || ''}">${esc(r.status)}</span></td>
        <td>${(r.companies_scanned || 0).toLocaleString()}</td><td>${(r.companies_errored || 0).toLocaleString()}</td><td>${(r.jobs_new || 0).toLocaleString()}</td><td>${(r.jobs_closed || 0).toLocaleString()}</td></tr>`).join('')}
      </tbody></table></div>`;
}
renderOverview.after = () => {
  $$('[data-fix]').forEach(b => b.onclick = () => act(b, () => b.dataset.fix === 'scan-all'
    ? api('POST', '/api/scan-control', { action: 'start', target: 'scheduled' })
    : api('POST', '/admin/api/overview/action', { action: b.dataset.fix }),
    { confirm: b.dataset.fix === 'release-stuck' ? ['Release stuck applications?', 'They were interrupted mid-send. They\'ll show as failed with "Try again", so nothing is sent twice by surprise.', 'Release'] : null }));
};

// ─── Users ──────────────────────────────────────────────────────────────────
async function renderUsers(params) {
  const q = params.get('q') || '';
  const users = await api('GET', '/admin/api/users?q=' + encodeURIComponent(q));
  return `<h1>Users</h1><p class="sub">Every account. Open one to see their data and fix things for them.</p>
    <div class="toolbar"><input type="search" id="uq" placeholder="Search email or name" value="${esc(q)}"><a class="btn" href="#/invites">Invite someone</a></div>
    <div class="tablewrap"><table><thead><tr><th>User</th><th>Role</th><th>Last login</th><th>Applications</th><th>Auto-apply</th><th>Gmail</th></tr></thead><tbody>
    ${users.map(u => `<tr class="click" data-href="#/users/${u.id}">
      <td><b>${esc(u.full_name || u.email)}</b><div class="muted small">${esc(u.email)}</div></td>
      <td>${u.disabled_at ? '<span class="badge bad">Disabled</span>' : u.is_admin ? '<span class="badge info">Admin</span>' : '<span class="badge">User</span>'}</td>
      <td>${ago(u.last_login_at)}</td>
      <td>${u.apps}${u.needs_you ? ` · <span class="badge warn">${u.needs_you} need them</span>` : ''}${u.failed ? ` · <span class="badge bad">${u.failed} failed</span>` : ''}</td>
      <td>${u.auto_apply ? '<span class="badge ok">On</span>' : '<span class="badge">Off</span>'}</td>
      <td>${u.gmail ? '<span class="badge ok">Connected</span>' : '<span class="muted">–</span>'}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">No users match.</td></tr>'}
    </tbody></table></div>`;
}
renderUsers.after = () => {
  const i = $('#uq'); let t; i.oninput = () => { clearTimeout(t); t = setTimeout(() => location.hash = '#/users' + (i.value ? '?q=' + encodeURIComponent(i.value) : ''), 300); };
  i.focus(); i.setSelectionRange(i.value.length, i.value.length);
};

let currentUser = null;
async function renderUser(id) {
  const d = await api('GET', '/admin/api/users/' + id); currentUser = d.user;
  const u = d.user, p = d.profile || {};
  const btn = (action, label, cls = '') => `<button class="btn ${cls}" data-uact="${action}">${label}</button>`;
  return `<a class="back" href="#/users">← Users</a>
    <h1>${esc(u.full_name || u.email)} ${u.is_admin ? '<span class="badge info">Admin</span>' : ''} ${u.disabled_at ? '<span class="badge bad">Disabled</span>' : ''}</h1>
    <p class="sub">${esc(u.email)} · joined ${when(u.created_at)} · last login ${ago(u.last_login_at)}</p>
    <div class="card" style="margin-bottom:14px"><h2>Fix things</h2><div class="actions">
      ${!u.is_admin && !u.disabled_at ? btn('impersonate', 'Open as user', 'primary') : ''}
      ${btn('reset-link', 'Make password reset link')}
      ${btn('signout', `Sign out everywhere (${u.sessions})`)}
      ${u.auto_apply ? btn('pause-auto', 'Pause auto-apply') : btn('resume-auto', 'Turn auto-apply on')}
      ${u.is_admin ? btn('remove-admin', 'Remove admin') : btn('make-admin', 'Make admin')}
      ${u.disabled_at ? btn('enable', 'Enable account') : btn('disable', 'Disable account', 'danger')}
    </div><p class="muted small" style="margin:10px 0 0">Open as user shows their dashboard exactly as they see it, for 1 hour. Anything you change there is real and is recorded in the audit log.</p></div>
    <div class="grid two">
      <div class="card"><h2>Profile</h2><dl>
        <dt>Name</dt><dd>${esc(p.full_name || '–')}</dd><dt>Contact email</dt><dd>${esc(p.email || '–')}</dd><dt>Phone</dt><dd>${esc(p.phone || '–')}</dd>
        <dt>Title</dt><dd>${esc(p.current_title || '–')}</dd><dt>Experience</dt><dd>${p.total_experience_years ?? '–'} years</dd>
        <dt>Location</dt><dd>${esc([p.current_city, p.current_state, p.current_country].filter(Boolean).join(', ') || '–')}</dd>
        <dt>Work authorization</dt><dd>${esc(p.work_authorization || '–')}${p.needs_sponsorship ? ' · needs sponsorship' : ''}</dd>
        <dt>ATS password</dt><dd>${p.has_ats_password ? 'Set (hidden)' : '<span class="badge warn">Not set</span>'}</dd>
        <dt>Gmail</dt><dd>${u.gmail ? esc(u.gmail_email || 'Connected') : '<span class="muted">Not connected</span>'}</dd>
        <dt>User ID</dt><dd class="mono">${esc(u.id)}</dd>
      </dl></div>
      <div class="card"><h2>Auto-apply</h2><dl>
        <dt>Status</dt><dd>${u.auto_apply ? '<span class="badge ok">On</span>' : '<span class="badge">Off</span>'}</dd>

// ─── Scans ──────────────────────────────────────────────────────────────────
const ATS_COLOR = { greenhouse: '#3D5FCB', ashby: '#2A8057', lever: '#92650A', smartrecruiters: '#B84A3E', workday: '#6B4FB3', bamboohr: '#4E8F2F',
  workable: '#B5651D', breezy: '#1F8A8A', teamtailor: '#C2417A', recruitee: '#5B7DB1', oraclecloud: '#A33A2A', rippling: '#7A5C2E', pinpoint: '#3E7D5A' };
const atsColor = (a) => ATS_COLOR[a] || '#6A6A6A';
const span = (secs) => { const a = Math.abs(Math.round(secs)), h = Math.floor(a / 3600), m = Math.floor(a % 3600 / 60); return h ? `${h}h ${m}m` : m ? `${m}m ${a % 60}s` : `${a}s`; };

// The scan log: live status every 10 s, runs + chart every 30 s, a countdown every second, while this page is open
async function renderScans() {
  return `<h1>Scans</h1><p class="sub" id="scanSub">Loading…</p>
    <div class="toolbar"><button class="btn primary" id="scanAll" disabled>Scan all now</button><button class="btn danger" id="stopAll" disabled>Stop all</button></div>
    <div class="grid kpis" id="scanCards"></div>
    <h2>Platforms</h2><div class="tablewrap" id="scanPlatforms" style="margin-bottom:18px"><div class="loading" style="padding:16px">Loading…</div></div>
    <h2>Jobs found per hour · last 48 hours</h2><div class="card" id="scanChart" style="margin-bottom:18px"><div class="loading">Loading…</div></div>
    <h2>Recent scan runs</h2><div class="tablewrap" id="scanRuns"><div class="loading" style="padding:16px">Loading…</div></div>`;
}
let scanLive = null, scanRuns = [], scanNext = null;
renderScans.after = () => {
  const ctl = (action, target) => api('POST', '/api/scan-control', { action, target }).then(r => { if (r.ok === false) throw new Error(r.message); return r; });
  const refresh = () => new Promise(ok => setTimeout(ok, 2500)).then(() => Promise.all([loadLive(), loadRuns()]));   // a new scan takes a moment to appear
  $('#scanAll').onclick = (e) => act(e.target, () => ctl('start', 'scheduled'), { then: refresh });
  $('#stopAll').onclick = (e) => act(e.target, () => ctl('stop', 'all'), { then: refresh,
    confirm: ['Stop all scans?', 'Progress so far is saved. The next scheduled run starts at its usual time.', 'Stop', true] });
  $('#scanPlatforms').onclick = (e) => {
    const b = e.target.closest('[data-scan]'); if (!b) return;
    const [action, ats] = b.dataset.scan.split(':');
    act(b, () => ctl(action, ats), { then: refresh });
  };

  function tick() {
    const el = $('#countdown'); if (!el || !scanNext) return;
    const s = (scanNext - Date.now()) / 1000;
    el.textContent = s > 0 ? 'in ' + span(s) : `due now (${span(-s)} late)`;
  }
  function renderCards() {
    const d = scanLive; if (!d) return;
    const sc = d.schedule, procs = d.processes || [], done = scanRuns.find(r => r.status !== 'running');
    scanNext = sc.nextAt ? new Date(sc.nextAt) : null;
    const card = (label, value, sub) => `<div class="card kpi"><div class="l">${label}</div><div class="n" style="font-size:20px">${value}</div><div class="s">${sub}</div></div>`;
    $('#scanCards').innerHTML =
      card('Open jobs', d.jobs.countedAt ? d.jobs.active.toLocaleString() : '…', d.jobs.countedAt ? `${d.jobs.total.toLocaleString()} ever found · counted ${ago(d.jobs.countedAt)}` : 'counting, takes a minute') +
      card('Next scheduled scan', !sc.loaded ? '<span class="badge bad">Not scheduled</span>' : sc.runningNow ? '<span class="badge ok">Running now</span>' : '<span id="countdown">–</span>',
        `${sc.nextMode === 'full' ? 'full scan (closes gone jobs)' : 'quick scan (new jobs)'} · every ${sc.intervalSecs ? span(sc.intervalSecs) : '–'}<br>last full scan ${ago(sc.lastFull)}`) +
      card('Last finished run', done ? `<span class="badge ${done.status === 'completed' ? 'ok' : 'bad'}">${done.status === 'completed' ? 'Completed' : 'Stopped early'}</span>` : '–',
        done ? `${ago(done.started_at)} · ${span(done.elapsed_secs || 0)}` : '') +
      card('Scanning now', procs.length ? `<span class="badge ok">${procs.length} running</span>` : '<span class="muted">Idle</span>',
        procs.length ? procs.map(p => `${esc(p.ats)} · ${esc(p.source)} · ${span(p.elapsedSecs)}`).join('<br>') : (d.bulk?.running ? 'bulk run going' : 'waiting for the next scan'));
    tick();
  }
  async function loadLive() {
    try { scanLive = await api('GET', '/api/scan-status'); }
    catch (e) { $('#scanPlatforms').innerHTML = `<div class="empty">Couldn't load platform status (${esc(e.message)}). The database may be busy with a scan; retrying every 10 seconds.</div>`; return; }
    const d = scanLive, procs = d.processes || [], all = procs.some(p => p.ats === 'all');
    $('#scanSub').textContent = `${procs.length ? 'Scanning now.' : 'Not scanning.'} Updated ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}.`;
    $('#scanAll').disabled = all; $('#scanAll').textContent = all ? 'Scanning all platforms…' : 'Scan all now';
    $('#stopAll').disabled = !procs.length;
    renderCards();
    $('#scanPlatforms').innerHTML = `<table><thead><tr><th>Platform</th><th>Status</th><th>Companies</th><th>Scanned in last ${d.platforms[0]?.freshHours ?? ''} h</th><th>Never scanned</th><th>Erroring</th><th>Open jobs</th><th>New 1 h</th><th>Last scan</th><th></th></tr></thead><tbody>
      ${d.platforms.map(p => {
        const live = p.companies - (p.dead || 0), pct = live ? Math.round(100 * p.fresh / live) : 100;
        const running = procs.some(x => x.ats === p.ats);
        const status = p.state === 'running' && pct < 100 ? '<span class="badge info">Scanning</span>' : pct >= 90 ? '<span class="badge ok">On time</span>' : '<span class="badge warn">Behind</span>';
        return `<tr><td><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${atsColor(p.ats)};margin-right:8px"></span><b>${esc(p.ats)}</b></td>
          <td>${status}</td><td>${live.toLocaleString()}</td>
          <td><span style="display:inline-block;width:60px;height:6px;border-radius:3px;background:var(--surface-2);vertical-align:middle;margin-right:8px;overflow:hidden"><i style="display:block;height:100%;width:${pct}%;background:${pct >= 90 ? 'var(--ok)' : 'var(--warn)'}"></i></span>${pct}%</td>
          <td>${p.waiting ? `<span class="badge warn">${p.waiting.toLocaleString()}</span>` : '<span class="muted">0</span>'}</td>
          <td>${p.erroring ? `<span class="badge bad">${p.erroring}</span>` : '<span class="muted">0</span>'}</td>
          <td>${d.jobs.countedAt ? (p.activeJobs || 0).toLocaleString() : '…'}</td><td>${p.new1h ? '+' + p.new1h.toLocaleString() : '<span class="muted">0</span>'}</td>
          <td>${ago(p.lastScan)}</td>
          <td>${running ? `<button class="btn danger" data-scan="stop:${esc(p.ats)}">Stop</button>` : all ? '' : `<button class="btn" data-scan="start:${esc(p.ats)}">Scan</button>`}</td></tr>`; }).join('')}
      </tbody></table>`;
  }
  async function loadRuns() {
    let data;
    try { data = await api('GET', '/api/scan-stats'); } catch (e) { $('#scanRuns').innerHTML = `<div class="empty">Couldn't load scan runs (${esc(e.message)}).</div>`; return; }
    scanRuns = data.runs; renderCards();
    const byHour = data.byHour;
    if (!byHour.length) $('#scanChart').innerHTML = '<div class="empty">No jobs found in the last 48 hours yet.</div>';
    else {
      const hours = {}, platforms = new Set();
      for (const r of byHour) { (hours[r.hour] ||= {})[r.ats] = +r.jobs_found; platforms.add(r.ats); }
      const keys = Object.keys(hours).sort(), list = [...platforms];
      const max = Math.max(...keys.map(h => Object.values(hours[h]).reduce((a, b) => a + b, 0)));
      $('#scanChart').innerHTML = `<div style="display:flex;align-items:flex-end;gap:3px;height:150px;overflow-x:auto">${keys.map(h => {
          const d = new Date(h), total = Object.values(hours[h]).reduce((a, b) => a + b, 0);
          return `<div style="flex:1;min-width:8px;display:flex;flex-direction:column;justify-content:flex-end;height:100%" title="${d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric' })}: ${total.toLocaleString()} jobs">
            ${list.filter(a => hours[h][a] > 0).map(a => `<div style="height:${Math.max(2, 120 * hours[h][a] / max)}px;background:${atsColor(a)}" title="${esc(a)}: ${hours[h][a].toLocaleString()} jobs"></div>`).join('')}
            <div class="muted" style="font-size:10px;height:16px;text-align:center">${d.getHours() % 6 ? '' : d.toLocaleTimeString([], { hour: 'numeric' })}</div></div>`; }).join('')}</div>
        <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:10px">${list.map(a => `<span class="small"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${atsColor(a)};margin-right:5px"></span>${esc(a)}</span>`).join('')}</div>`;
    }
    $('#scanRuns').innerHTML = scanRuns.length ? `<table><thead><tr><th>Started</th><th>Took</th><th>Result</th><th>Companies</th><th>New jobs</th><th>Closed</th><th>Errors</th></tr></thead><tbody>
      ${scanRuns.slice(0, 15).map(r => `<tr><td>${when(r.started_at)}</td><td>${r.elapsed_secs ? span(r.elapsed_secs) : '–'}</td>
        <td><span class="badge ${{ completed: 'ok', failed: 'bad', running: 'info' }[r.status] || ''}">${r.status === 'failed' ? 'stopped early' : esc(r.status)}</span></td>
        <td>${(+r.companies_scanned || 0).toLocaleString()}</td><td>+${(+r.jobs_new || 0).toLocaleString()}</td>
        <td>${(+r.jobs_closed || 0).toLocaleString()}</td><td>${+r.companies_errored ? `<span class="badge bad">${(+r.companies_errored).toLocaleString()}</span>` : '<span class="muted">0</span>'}</td></tr>`).join('')}
      </tbody></table>` : '<div class="empty">No runs yet.</div>';
  }
  loadLive(); loadRuns();
  pollers.push(setInterval(loadLive, 10_000), setInterval(loadRuns, 30_000), setInterval(tick, 1000));
};

  return `<h1>Invites</h1><p class="sub">Sign-up is invite-only. Invite an email, then they create their account at /signup.</p>
    ${requests.length ? `<h2>Requests from the landing page (${requests.length})</h2>
    <div class="tablewrap" style="margin-bottom:22px"><table><thead><tr><th>Email</th><th>Looking for</th><th>Asked</th><th></th></tr></thead><tbody>
    ${requests.map(r => `<tr><td>${esc(r.email)}</td><td class="small">${esc(r.note || '–')}</td><td>${ago(r.created_at)}</td>
      <td><div class="actions"><button class="btn primary" data-reqinvite="${esc(r.email)}">Invite</button><button class="btn" data-reqdismiss="${esc(r.email)}">Dismiss</button></div></td></tr>`).join('')}
    </tbody></table></div><h2>Invites</h2>` : ''}
    <form class="card toolbar" id="invForm" style="margin-bottom:14px">
      <input type="email" id="invEmail" placeholder="email@company.com" required style="min-width:240px">
      <input id="invUser" placeholder="Existing user ID (optional)" style="min-width:250px" class="mono">
      <label class="small"><input type="checkbox" id="invAdmin"> Admin</label>
      <button class="btn primary" type="submit">Invite</button></form>
    <div class="tablewrap"><table><thead><tr><th>Email</th><th>Role</th><th>Linked to</th><th>Invited</th><th>Status</th><th></th></tr></thead><tbody>
    ${rows.map(i => `<tr><td>${esc(i.email)}</td><td>${i.is_admin ? '<span class="badge info">Admin</span>' : 'User'}</td>
      <td class="mono">${i.user_id ? esc(i.linked_email || i.user_id.slice(0, 8) + '…') : '–'}</td><td>${when(i.created_at)}</td>
      <td>${i.used_at ? `<span class="badge ok">Signed up ${ago(i.used_at)}</span>` : '<span class="badge warn">Waiting</span>'}</td>
      <td>${i.used_at ? '' : `<button class="btn" data-revoke="${esc(i.email)}">Revoke</button>`}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">No invites yet.</td></tr>'}
    </tbody></table></div>`;
}
renderInvites.after = () => {
  $('#invForm').onsubmit = (e) => { e.preventDefault(); act(e.submitter, () => api('POST', '/admin/api/invites', { email: $('#invEmail').value, user_id: $('#invUser').value.trim() || null, is_admin: $('#invAdmin').checked })); };
  $$('[data-reqinvite]').forEach(b => b.onclick = () => act(b, () => api('POST', '/admin/api/invites', { email: b.dataset.reqinvite })));
  $$('[data-reqdismiss]').forEach(b => b.onclick = () => act(b, () => api('POST', `/admin/api/invite-requests/${encodeURIComponent(b.dataset.reqdismiss)}/dismiss`)));
  $$('[data-revoke]').forEach(b => b.onclick = () => act(b, () => api('DELETE', '/admin/api/invites/' + encodeURIComponent(b.dataset.revoke)), { confirm: ['Revoke this invite?', `${b.dataset.revoke} won't be able to sign up.`, 'Revoke'] }));
};

// ─── System ─────────────────────────────────────────────────────────────────
async function renderSystem() {
  const s = await api('GET', '/admin/api/system');
  const yes = (v, ok = 'Set up', no = 'Not set up') => v ? `<span class="badge ok">${ok}</span>` : `<span class="badge warn">${no}</span>`;
  return `<h1>System</h1><p class="sub">What the app runs on, and what's misconfigured.</p>
    <div class="grid two"><div class="card"><dl>
      <dt>Server</dt><dd>Up ${s.uptimeMin} min · Node ${esc(s.node)}</dd>
      <dt>Database</dt><dd>${s.db.ok ? `<span class="badge ok">OK</span> ${s.db.ms} ms · ${esc(s.db.size)}` : `<span class="badge bad">Down</span> ${esc(s.db.error)}`}</dd>
      <dt>Resume rewriting</dt><dd>${esc(s.llm.provider)} · ${esc(s.llm.model)} ${s.llm.keySet ? '' : '<span class="badge bad">API key missing</span>'}</dd>
      <dt>Reset emails (Resend)</dt><dd>${yes(s.email.resend, 'Set up', 'Not set up: reset links only go to the server log')}</dd>
      <dt>Gmail connect</dt><dd>${yes(s.gmailOAuth)}</dd>
      <dt>Dashboard URL</dt><dd class="mono">${esc(s.urls.app)}</dd><dt>Login site</dt><dd class="mono">${esc(s.urls.site || 'same host')}</dd>
      <dt>Cookie domain</dt><dd class="mono">${esc(s.urls.cookieDomain || 'this host only')}</dd>
    </dl></div>
    <div class="card"><h2>Recent server errors</h2>${s.errors.length ? `<pre>${esc(s.errors.join('\n'))}</pre>` : '<div class="empty">None in the server log.</div>'}</div></div>`;
}

// ─── Audit ──────────────────────────────────────────────────────────────────
async function renderAudit() {
  const rows = await api('GET', '/admin/api/audit');
  return `<h1>Audit log</h1><p class="sub">Every change made from this portal.</p>
    <div class="tablewrap"><table><thead><tr><th>When</th><th>Admin</th><th>Action</th><th>Target</th><th>Details</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${when(r.created_at)}</td><td>${esc(r.admin_email)}</td><td><b>${esc(r.action)}</b></td>
      <td class="small">${/^[0-9a-f-]{36}$/.test(r.target || '') ? `<a href="#/users/${r.target}">${esc(r.detail?.email || r.target.slice(0, 8) + '…')}</a>` : esc(r.target || '–')}</td>
      <td class="mono">${esc(r.detail ? JSON.stringify(r.detail) : '')}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">Nothing yet.</td></tr>'}
    </tbody></table></div>`;
}

// rows that link somewhere
view.addEventListener('click', (e) => { const tr = e.target.closest('tr[data-href]'); if (tr && !e.target.closest('a,button')) location.hash = tr.dataset.href; });
$('#logout').onclick = async (e) => { e.preventDefault(); const r = await fetch('/auth/logout', { method: 'POST' }).then(r => r.json()).catch(() => ({})); location.assign(r.redirect || '/login'); };
fetch('/auth/me').then(r => r.json()).then(me => $('#who').textContent = me.email || '').catch(() => {});
route();
</script>
</body>
</html>
