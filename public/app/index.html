const AP_FIELDS = [['company', 'Company'], ['title', 'Job title'], ['link', 'Link'], ['posting', 'Posting text']];
const apState = { q: '', fields: [], source: 'all', view: 'list', page: 1 };
const fmtDay = d => (d ? new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: new Date(d).getFullYear() === new Date().getFullYear() ? undefined : 'numeric' }) : '');
const nfmt = n => Number(n || 0).toLocaleString();
async function renderApplied() {
  $('#view').innerHTML = `
    <div class="page-head"><div><h1 class="sr-only">Applied</h1><p>Every application you've sent, with the posting and the resume that went out.</p></div></div>
    <form class="searchbar" id="apSearch" role="search"><input id="apQ" type="search" placeholder="Search a company, job title, link or words in the posting" value="${esc(apState.q)}" aria-label="Search applications"><button class="btn primary" type="submit">Search</button></form>
    <div class="ap-controls">
      <div class="ap-fields" role="group" aria-label="Search in">${AP_FIELDS.map(([k, l]) => `<button type="button" class="fchip" data-f="${k}" aria-pressed="${apState.fields.includes(k)}">${l}<span class="n" data-n="${k}"></span></button>`).join('')}</div>
      <span class="spacer"></span>
      <div class="seg" role="tablist" aria-label="View"><button role="tab" data-v="list" aria-selected="${apState.view === 'list'}">Applications</button><button role="tab" data-v="company" aria-selected="${apState.view === 'company'}">By company</button></div>
    </div>
    <p class="ap-line" id="apLine" aria-live="polite"></p>
    <div id="apList" class="ap-list"></div>
    <div id="apMore"></div>`;
  $('#apSearch').addEventListener('submit', e => { e.preventDefault(); apState.q = $('#apQ').value.trim(); apState.page = 1; loadApplied(); });
  $$('.fchip').forEach(b => b.addEventListener('click', () => {
    const f = b.dataset.f; apState.fields = apState.fields.includes(f) ? apState.fields.filter(x => x !== f) : [...apState.fields, f];
    b.setAttribute('aria-pressed', String(apState.fields.includes(f))); apState.page = 1; loadApplied();
  }));
  $$('.seg [data-v]').forEach(b => b.addEventListener('click', () => { apState.view = b.dataset.v; $$('.seg [data-v]').forEach(x => x.setAttribute('aria-selected', String(x === b))); apState.page = 1; loadApplied(); }));
  loadApplied();
}
function markSnippet(s) { return s ? `<p class="snip">${esc(s.before)}<mark>${esc(s.match)}</mark>${esc(s.after)}</p>` : ''; }
async function loadApplied(append = false) {
  const p = new URLSearchParams({ page: apState.page, limit: 50 });
  if (apState.q) p.set('q', apState.q);
  if (apState.fields.length) p.set('fields', apState.fields.join(','));
  if (apState.source !== 'all') p.set('source', apState.source);
  if (apState.view === 'company') p.set('groupBy', 'company');
  const list = $('#apList'); if (!list) return;
  if (!append) list.innerHTML = `<div class="skeleton" style="height:64px;margin-bottom:8px"></div>`.repeat(4);
  let d; try { ({ data: d } = await api('GET', `/users/${USER}/applied?${p}`)); } catch (err) { list.innerHTML = `<div class="notice bad">${esc(err.message)}</div>`; return; }
  const c = d.counts || {};
  $$('[data-n]').forEach(n => { n.textContent = apState.q ? ` ${nfmt(c[n.dataset.n])}` : ''; });
  const total = c.total || 0;
  $('#apLine').textContent = !total ? '' : apState.q
    ? `${nfmt(total)} application${total === 1 ? '' : 's'} at ${nfmt(c.companies)} compan${c.companies === 1 ? 'y' : 'ies'} match “${apState.q}”: ${AP_FIELDS.filter(([k]) => c[k]).map(([k, l]) => `${l.toLowerCase()} ${nfmt(c[k])}`).join(', ')}.`
    : `${nfmt(total)} application${total === 1 ? '' : 's'} at ${nfmt(c.companies)} compan${c.companies === 1 ? 'y' : 'ies'}${c.from_tsenta ? `, ${nfmt(c.from_tsenta)} of them through Tsenta` : ''}.`;
  let html = '';
  if (apState.view === 'company') {
    html = d.companies.map(g => `<button class="ap-co" type="button" data-co="${esc(g.company)}">
        <span class="co-n"><b>${g.roleCount}</b>${g.roleCount === 1 ? 'role' : 'roles'}</span>
        <span class="co-main"><h3>${esc(g.company)}</h3><span class="muted">${g.titles.filter(Boolean).slice(0, 3).map(esc).join('; ')}${g.roleCount > 3 ? '; …' : ''}</span></span>
        <span class="co-when">${g.interviews ? `<span class="badge sent">${g.interviews} interview${g.interviews === 1 ? '' : 's'}</span>` : ''}<span class="muted">Last ${fmtDay(g.lastAppliedAt)}</span></span></button>`).join('');
  } else {
    html = d.applications.map(a => `<button class="ap-row" type="button" data-app="${a.id}">
        <span class="ap-date">${fmtDay(a.appliedAt)}</span>
        <span class="ap-main"><h3>${esc(a.title || 'Untitled role')}</h3>
          <span class="ap-meta"><b>${esc(a.company || '')}</b>${a.location ? `<span>${esc(a.location)}</span>` : ''}${a.ats ? `<span>${esc(pretty(a.ats))}</span>` : ''}</span>
          ${a.matchedOn.length ? `<span class="ap-hits">${a.matchedOn.map(m => `<span class="tag cobalt">${esc((AP_FIELDS.find(f => f[0] === m) || [m, m])[1])}</span>`).join(' ')}</span>` : ''}
          ${markSnippet(a.postingSnippet)}</span>
        <span class="ap-side">${a.status !== 'APPLIED' ? `<span class="status st-${a.status}">${esc(STATUS_LABEL[a.status] || pretty(a.status))}</span>` : ''}${a.source === 'tsenta' ? '<span class="tag">Tsenta</span>' : ''}
          ${a.hasResume ? `<span class="have yes" role="link" tabindex="0" data-dl="${a.id}" title="Download the resume you sent">Resume ↓</span>` : ''}</span></button>`).join('');
  }
  if (!append) list.innerHTML = html || `<div class="empty"><b>${apState.q ? 'Nothing matches that search.' : 'Nothing sent yet.'}</b><p class="muted">${apState.q ? 'Try fewer words, or search all fields.' : 'Applications you send from Jobs or Auto-apply show up here with the posting and resume.'}</p></div>`;
  else list.insertAdjacentHTML('beforeend', html);
  const shown = $$('.ap-row, .ap-co', list).length; const max = apState.view === 'company' ? d.totalGroups : total;
  $('#apMore').innerHTML = shown < max ? `<button class="btn" id="apMoreBtn" type="button">Show more (${nfmt(max - shown)} left)</button>` : '';
  $('#apMoreBtn')?.addEventListener('click', () => { apState.page++; loadApplied(true); });
  // The saved resume downloads straight from the row, without opening the application.
  $$('[data-dl]:not([data-b])', list).forEach(c => { c.dataset.b = 1;
    const go = e => { e.stopPropagation(); e.preventDefault(); window.location.href = resumeUrl(c.dataset.dl, true, true); };
    c.addEventListener('click', go); c.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') go(e); }); });
  $$('.ap-row:not([data-b])', list).forEach(r => { r.dataset.b = 1; r.addEventListener('click', e => { if (!e.target.closest('[data-dl]')) location.hash = `#/sent/${r.dataset.app}`; }); });
  $$('.ap-co:not([data-b])', list).forEach(r => { r.dataset.b = 1; r.addEventListener('click', () => {
    apState.q = r.dataset.co; apState.fields = ['company']; apState.view = 'list'; apState.page = 1; renderApplied();
  }); });
}

// ═══ Auto-apply ═════════════════════════════════════════════════════════════
const POSTED_OPTS = [[3, 'Past 3 days'], [7, 'Past week'], [14, 'Past 2 weeks'], [30, 'Past month']];
async function renderAutoApply() {

  const lastRun = aa.runs?.find(r => !r.dryRun);
  $('#view').innerHTML = `
    <div class="page-head"><div><h1 class="sr-only">Auto-apply</h1><p>Choose what to apply for. Each lane finds jobs, tailors your resume and fills the form. Results show on your dashboard.</p></div><span class="spacer"></span>

    ${!profiles.length ? `<div class="notice info">Set up a resume profile first: auto-apply sends it. <a href="#/profile">Go to Profile</a></div>` : ''}
    <div class="aa">
      <div style="display:grid;gap:22px">

      </div>
      <div style="display:grid;gap:22px">

          <div class="panel-body" id="aaPlan"><p class="muted" style="margin:0">${lastRun ? `Last run ${ago(lastRun.startedAt)}.` : 'Not run yet.'} Preview shows which jobs the next run would pick, without sending anything.</p></div></section>
        <section class="panel"><div class="panel-head"><h2>Limits</h2></div><form class="panel-body" id="aaLimits" style="display:grid;gap:12px">
          <div class="form-grid"><label class="field">Applications per day<input type="number" name="dailyCap" min="1" max="100" value="${aa.dailyCap}"></label>
            <label class="field">Per company in 30 days<input type="number" name="perCompanyCap30d" min="1" max="20" value="${aa.perCompanyCap30d}"></label></div>
          <label class="check"><input type="checkbox" name="acceptConsent" ${aa.acceptConsent ? 'checked' : ''}> Tick required "I agree" boxes, such as privacy notices</label>

      </div>
    </div>`;

  });

    e.preventDefault(); const f = e.target;
    await api('PUT', `/users/${USER}/auto-apply`, { dailyCap: f.dailyCap.value, perCompanyCap30d: f.perCompanyCap30d.value, acceptConsent: f.acceptConsent.checked });
    toast('Limits saved.');

    const d = profiles.find(p => p.isDefault);
    await api('POST', `/users/${USER}/auto-apply/lanes`, { name: d ? `${d.name} roles` : 'New lane', resumeProfileId: d?.id || null });

    e.target.disabled = true; e.target.textContent = 'Checking…';

async function pollRun() {
  for (let i = 0; i < 90; i++) {
    await new Promise(r => setTimeout(r, 3000));
    if (location.hash !== '#/auto-apply') return;
    const { data } = await api('GET', `/users/${USER}/auto-apply`);
    if (!data.running) { const r = data.runs?.find(x => !x.dryRun); toast(r ? `Run finished: ${runLine(r.summary)}` : 'Run finished.'); renderAutoApply(); loadApps(); return; }
  }
}
function runLine(summary) {
  if (!summary) return 'no details';
  if (summary.skipped) return summary.skipped;
  const o = summary.outcomes || {};
  const parts = [`${summary.plan?.queued ?? 0} picked`, o.SUBMITTED && `${o.SUBMITTED} sent`, o.FILLED && `${o.FILLED} waiting for your OK`, o.NEEDS_YOU && `${o.NEEDS_YOU} need you`, o.FAILED && `${o.FAILED} failed`].filter(Boolean);
  return parts.join(', ');
}
function planHTML(plan) {

function laneHTML(l, profiles) {

// Titles you have looked for are kept with the lane settings you used, and fill the form again in one click (then Save lane).
const recentTitles = () => store.get('recentTitles', []);
function renderTitleChips(form) {
  const host = form.querySelector('[data-recent-titles]'); if (!host) return;
  const list = recentTitles();
  host.innerHTML = list.length ? `<span class="muted">Recent</span>${list.map((r, i) => `<span class="chip-r"><button type="button" data-i="${i}" title="${esc([r.ex && `leave out ${r.ex}`, `min match ${r.min}`, (r.wp || []).map(pretty).join('/')].filter(Boolean).join(' · '))}">${esc(r.q)}</button><button type="button" data-rm="${i}" aria-label="Remove ${esc(r.q)}">×</button></span>`).join('')}<button type="button" class="btn sm quiet" data-clear-recent>Clear</button>` : '';

function rememberTitles(f) {
  const q = f.search.value.trim(); if (!q) return;
  const entry = { q, ex: f.excludeSearch.value, skip: f.excludeTitle.value, min: f.minScore.value, posted: f.postedWithinDays.value, wp: $$('[name=wp]:checked', f).map(x => x.value), review: f.reviewBeforeSubmit.checked };
  store.set('recentTitles', [entry, ...recentTitles().filter(r => r.q.toLowerCase() !== q.toLowerCase())].slice(0, 8));
  $$('.lane').forEach(renderTitleChips);
}
function bindLane(form) {

    if (x) { store.set('recentTitles', recentTitles().filter((_, i) => i !== Number(x.dataset.rm))); return $$('.lane').forEach(renderTitleChips); }
    if (e.target.closest('[data-clear-recent]')) { store.set('recentTitles', []); return $$('.lane').forEach(renderTitleChips); }
    if (!go) return;
    const r = recentTitles()[Number(go.dataset.i)]; if (!r) return;

      search: f.search.value, excludeSearch: f.excludeSearch.value, excludeTitle: f.excludeTitle.value, postedWithinDays: f.postedWithinDays.value,
      tailorMode: 'match', reviewBeforeSubmit: f.reviewBeforeSubmit.checked, workplaceTypes: $$('[name=wp]:checked', f).map(x => x.value) };
    try { await api('PATCH', `/users/${USER}/auto-apply/lanes/${id}`, body); form.dataset.off = String(!body.enabled); rememberTitles(f); toast('Lane saved.'); } catch (err) { toast(err.message); }
  });
  form.querySelector('[data-del]').addEventListener('click', async () => {
    if (!confirm('Delete this lane? Applications it already made stay in your tracker.')) return;

  });
}

}
const refreshApplications = () => { loadApps(); if (location.hash.startsWith('#/review/')) return reviewNext(); if (location.hash.startsWith('#/auto-apply')) renderAutoApply(); else if ($('#drawer').classList.contains('open') && state.openApp) openApplication(state.openApp); };
function bindQueueItem(el) {
  const id = el.dataset.app;
  el.querySelector('[data-skip]').addEventListener('click', async () => { await api('POST', `/users/${USER}/applications/${id}/skip`); toast('Skipped.'); refreshApplications(); });
  el.querySelector('[data-details]').addEventListener('click', () => { if (['NEEDS_YOU', 'NEEDS_REVIEW'].includes(el.dataset.state) && !el.closest('#view[data-review]')) location.hash = `#/review/${id}`; else openApplication(id); });
  el.querySelector('[data-retry]')?.addEventListener('click', async e => { e.target.disabled = true; try { await api('POST', `/users/${USER}/applications/${id}/apply`, {}); toast('Trying again…'); } catch (err) { toast(err.message); } refreshApplications(); });
  el.querySelector('[data-approve]')?.addEventListener('click', async e => {
    e.target.disabled = true;
    const edits = {}; $$('[data-e]', el).forEach(f => { if (f.value.trim() && f.value !== f.dataset.orig) edits[f.dataset.e] = f.value.trim(); });
    try {
      // edited answers refill the form with the new values, then send; untouched forms send as they are
      if (Object.keys(edits).length) await api('POST', `/users/${USER}/applications/${id}/answers`, { answers: edits, remember: false, approve: true });
      else await api('POST', `/users/${USER}/applications/${id}/approve`, {});
      toast('Submitting…');
    } catch (err) { toast(err.message); }
    refreshApplications();
  });
  const ansBtn = el.querySelector('[data-answer]');
  const ready = () => { if (ansBtn) ansBtn.disabled = $$('[data-q]', el).some(f => !f.value.trim()); };
  el.addEventListener('input', ready); el.addEventListener('change', ready);
  el.querySelector('[data-answer]')?.addEventListener('click', async () => {
    const answers = {}; let blank = 0;
    $$('[data-q]', el).forEach(f => { if (f.value.trim()) answers[f.dataset.q] = f.value.trim(); else blank++; });
    if (blank) { toast(`Answer all ${blank + Object.keys(answers).length} questions first.`); return; }
    await api('POST', `/users/${USER}/applications/${id}/answers`, { answers, remember: !!el.querySelector('[name=remember]')?.checked, approve: true });
    toast('Saved. Submitting…'); refreshApplications();
  });
}

async function renderReview() {

        <p>${nr ? `Check what we filled in for <b>${co}</b>, and edit anything before we submit.` : ask ? `We filled what we could for <b>${co}</b>. Add the missing details, then we send it.` : blank ? `We haven't filled the <b>${co}</b> form yet. Start applying and we'll fill it from your profile.` : esc(d.reason || '')}</p>

function bindListSection(key) {
  const sec = $(`#sec-${key}`); if (!sec) return;

    if (b.dataset.up && i > 0) { [list[i - 1], list[i]] = [list[i], list[i - 1]]; await patchRP({ sections: { [key]: list } }, 'Moved.'); return renderProfile(); }
  });
}
function fieldInput(name, label, type, value) {
  if (type === 'bool') return `<label class="check" style="align-self:center"><input type="checkbox" name="${name}" ${value ? 'checked' : ''}/> ${label}</label>`;
  if (type === 'lines') return `<label class="field wide">${label}<textarea name="${name}" rows="5">${esc((value || []).join('\n'))}</textarea></label>`;
  if (type === 'textarea') return `<label class="field wide">${label}<textarea name="${name}" rows="4">${esc(value || '')}</textarea></label>`;
  if (type === 'csv') return `<label class="field wide">${label}<input type="text" name="${name}" value="${esc((value || []).join(', '))}"/></label>`;
  if (type === 'month') return `<label class="field">${label}<input type="text" name="${name}" placeholder="Aug 2023" value="${esc(fmtMonth(value))}"/></label>`;
  return `<label class="field">${label}<input type="text" name="${name}" value="${esc(value ?? '')}"/></label>`;
}
function readFields(form, fields) {
  const out = {};
  for (const [name, , type] of fields) {
    const el = form.querySelector(`[name="${name}"]`); if (!el) continue;
    if (type === 'bool') out[name] = el.checked;
    else if (type === 'lines') out[name] = el.value.split('\n').map(x => x.replace(/^\s*[•\-*]\s*/, '').trim()).filter(Boolean);
    else if (type === 'csv') out[name] = el.value.split(',').map(x => x.trim()).filter(Boolean);
    else out[name] = el.value.trim();
  }
  return out;

async function parseResumeFile(file) {
  const fd = new FormData(); fd.append('resume', file);
  const r = await fetch('/api/parse-resume', { method: 'POST', body: fd }); const parsed = await r.json();
  if (!r.ok) throw new Error(parsed.error || `${file.name} couldn't be read`);
  return parsed.text;
}

      statusLine.textContent = 'Not connected';
      badge.style.display = 'none';
      $('#gmailConnectBtn').addEventListener('click', async () => {
        const { data: d } = await api('GET', `/users/${USER}/gmail/auth-url`);
        if (d.url) window.location.href = d.url;
      });
    }
  } catch(e) {
    $('#gmailStatusLine').textContent = 'Could not load status';
    console.error('Gmail status error:', e);
  }

  // Save settings
  $('#saveSettingsBtn').addEventListener('click', async () => {
    // Auto-apply settings live on the Auto-apply page; this only saves the ATS password.
    const pw = $('#s_ats_password').value.trim();
    if (!pw) return toast('Type a password first.');
    const payload = { ats_password: pw };
    try {
      await api('PUT', `/users/${USER}/profile`, payload);
      const msg = $('#settingsSavedMsg');
      msg.style.display = 'inline';
      if (pw) $('#s_ats_password').value = '';
      setTimeout(() => { msg.style.display = 'none'; }, 2500);
    } catch(e) { toast('Save failed: ' + e.message); }
  });
}

// ═══ Theme + boot ═══════════════════════════════════════════════════════════
const savedTheme = store.get('theme', null); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$('#themeBtn').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', document.documentElement.dataset.theme);
});
route();
</script>
</body>
</html>
