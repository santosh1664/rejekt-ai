<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rejekt.ai</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Cpath d='M8 22h16M8 16h10M8 10h13' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
<style>
/* ═══ Tokens ════════════════════════════════════════════════════════════════
   Rejekt.ai identity: white page, black actions, pale status tints
   (green = good / sent, amber = waiting, red = gap, soft blue = new / info). */
:root {
  --paper: #FFFFFF; --surface: #FFFFFF; --surface-2: #F6F6F5; --ink: #111111; --ink-2: #3B3B3B; --muted: #6A6A6A;
  --line: #DEDEDC; --line-2: #EBEBE9;
  --cobalt: #17382B; --cobalt-ink: #FFFFFF; --cobalt-soft: #EAF1EC;
  --signal: #F5CE78; --signal-soft: #FFFAEB; --signal-ink: #92650A;
  --ok: #2A8057; --ok-soft: #F2FAF5; --warn: #92650A; --warn-soft: #FFFAEB; --bad: #B84A3E; --bad-soft: #FFF5F3;
  --info: #3D5FCB; --info-soft: #F4F8FF;
  --ok-bd: #DCF1E5; --warn-bd: #F7EBC4; --bad-bd: #FBDCD7; --info-bd: #DCE7FB;
  --ok-mid: #8FD3AF; --warn-mid: #F5CE78; --bad-mid: #F0A59B; --info-mid: #B3CBF5;
  --meter-off: #E8E8E6;
  --r-lg: 18px; --r-md: 12px; --r-sm: 8px;
  --display: 'Schibsted Grotesk', system-ui, sans-serif;
  --head: 'Big Shoulders Display', 'Schibsted Grotesk', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --text: 'Schibsted Grotesk', system-ui, -apple-system, sans-serif;
  --rail: 232px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E0E0E; --surface: #161616; --surface-2: #1E1E1E; --ink: #F2F2F2; --ink-2: #CFCFCF; --muted: #9A9A9A;
    --line: #2C2C2C; --line-2: #232323; --cobalt: #F2F2F2; --cobalt-ink: #111111; --cobalt-soft: #262626;
    --signal: #E9C46A; --signal-soft: #2E2812; --signal-ink: #F3D98A;
    --ok: #6FD3A0; --ok-soft: #14261D; --warn: #E9C46A; --warn-soft: #2E2812; --bad: #F2948A; --bad-soft: #2E1A17;
    --info: #9DB6F5; --info-soft: #172036;
    --ok-bd: #24523C; --warn-bd: #55481E; --bad-bd: #5A2E29; --info-bd: #2B3C66;
    --ok-mid: #3F8F69; --warn-mid: #B8963E; --bad-mid: #B5675E; --info-mid: #5A78C8; --meter-off: #2C2C2C;
  }
}
:root[data-theme="dark"] {
  --paper: #0E0E0E; --surface: #161616; --surface-2: #1E1E1E; --ink: #F2F2F2; --ink-2: #CFCFCF; --muted: #9A9A9A;
  --line: #2C2C2C; --line-2: #232323; --cobalt: #F2F2F2; --cobalt-ink: #111111; --cobalt-soft: #262626;
  --signal: #E9C46A; --signal-soft: #2E2812; --signal-ink: #F3D98A;
  --ok: #6FD3A0; --ok-soft: #14261D; --warn: #E9C46A; --warn-soft: #2E2812; --bad: #F2948A; --bad-soft: #2E1A17;
  --info: #9DB6F5; --info-soft: #172036;
  --ok-bd: #24523C; --warn-bd: #55481E; --bad-bd: #5A2E29; --info-bd: #2B3C66;
  --ok-mid: #3F8F69; --warn-mid: #B8963E; --bad-mid: #B5675E; --info-mid: #5A78C8; --meter-off: #2C2C2C;
}

/* ═══ Base ══════════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--text); font-size: 15px; line-height: 1.5; background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--cobalt); }
:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; border-radius: 6px; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
h1, h2, h3 { font-family: var(--display); letter-spacing: -0.015em; margin: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ═══ Shell: left rail + main ═══════════════════════════════════════════════ */
.app { display: grid; grid-template-columns: var(--rail) 1fr; min-height: 100vh; }
.rail { position: sticky; top: 0; height: 100vh; padding: 22px 16px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); padding: 4px 8px 18px; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand span { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: var(--r-md); text-decoration: none; color: var(--ink-2); font-weight: 500; }
.nav a svg { width: 18px; height: 18px; flex: none; opacity: .8; }
.nav a:hover { background: var(--surface-2); }
.nav a[aria-current="page"] { background: var(--cobalt-soft); color: var(--cobalt); }
.nav a .count { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rail-foot { margin-top: auto; display: grid; gap: 10px; }
.rail-card { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; font-size: 13px; }
.rail-card b { display: block; font-size: 13px; }
.bar { height: 6px; border-radius: 6px; background: var(--line-2); overflow: hidden; margin-top: 8px; }
.bar > i { display: block; height: 100%; background: var(--cobalt); border-radius: 6px; }
.theme-btn { display: flex; align-items: center; gap: 10px; border: 0; background: none; color: var(--muted); padding: 8px 10px; border-radius: var(--r-md); font-size: 13px; }
.theme-btn:hover, .theme-btn[aria-current] { background: var(--surface-2); color: var(--ink); }
main { min-width: 0; padding: 28px 32px 60px; }
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head h1 { font-size: 30px; font-weight: 700; line-height: 1.1; }
.page-head p { margin: 6px 0 0; color: var(--ink-2); }
.page-head .spacer { flex: 1; }
/* Page names stay for screen readers; the nav already shows which tab you're on. */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.page-head h1.sr-only + p { margin-top: 0; }

/* ═══ Controls ══════════════════════════════════════════════════════════════ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--cobalt); border-color: var(--cobalt); color: var(--cobalt-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { border-color: transparent; background: none; color: var(--ink-2); }
.btn.quiet:hover { background: var(--surface-2); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); }
.icon-btn:hover { color: var(--ink); border-color: var(--muted); }
.icon-btn:disabled { opacity: .4; }
.icon-btn svg { width: 16px; height: 16px; }
input:not([type]), input[type=text], input[type=url], input[type=email], input[type=tel], input[type=number], input[type=search], input[type=date], select, textarea {
  width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 11px; font-size: 14px; outline: 0; }
input:focus, select:focus, textarea:focus { border-color: var(--cobalt); box-shadow: 0 0 0 3px var(--cobalt-soft); }
textarea { resize: vertical; line-height: 1.5; }
label.field { display: grid; gap: 5px; font-size: 13px; color: var(--ink-2); font-weight: 500; align-content: start; }
label.field small { color: var(--muted); font-weight: 400; font-size: 11.5px; order: 1; }   /* hint sits under the input so labels and inputs line up */
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--cobalt); }
.tag { display: inline-flex; align-items: center; gap: 5px; border-radius: 6px; padding: 2px 8px; font-size: 12.5px; font-weight: 500; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line-2); }
.tag.hit { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.tag.miss { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.tag.signal { background: var(--signal-soft); color: var(--signal-ink); border-color: transparent; }
.tag.cobalt { background: var(--cobalt-soft); color: var(--cobalt); border-color: transparent; }
.notice { border-radius: var(--r-md); padding: 12px 14px; font-size: 14px; margin: 12px 0; }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.bad { background: var(--bad-soft); color: var(--bad); }
.notice.info { background: var(--cobalt-soft); color: var(--cobalt); }
.empty { text-align: center; padding: 48px 20px; color: var(--muted); }
.empty h3 { color: var(--ink); font-size: 19px; margin-bottom: 6px; }
.skeleton { background: linear-gradient(90deg, var(--line-2), var(--line), var(--line-2)); background-size: 200% 100%; animation: sh 1.3s infinite; border-radius: var(--r-md); }
@keyframes sh { to { background-position: -200% 0; } }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 11px 16px; border-radius: 12px; font-size: 14px; z-index: 90; max-width: calc(100vw - 32px); box-shadow: 0 10px 30px -10px rgba(16,26,51,.5); }

/* ═══ Signal meter: the one bold element ═════════════════════════════════════ */
.score { display: grid; justify-items: start; gap: 5px; min-width: 64px; }
.score b { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: .9; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; color: var(--ink); }
.score b small { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 1px; }
.meter { display: grid; grid-template-columns: repeat(10, 4px); gap: 2px; height: 12px; align-items: end; }
.meter i { display: block; width: 4px; height: calc(var(--n) * 1.2px + 1px); border-radius: 1.5px; background: var(--meter-off); }
.score.tier-strong .meter i.on { background: var(--signal); }
.score.tier-good .meter i.on { background: var(--cobalt); }
.score.tier-weak .meter i.on { background: var(--muted); }
.score.big b { font-size: 54px; }
.score.big .meter { grid-template-columns: repeat(10, 7px); gap: 3px; height: 22px; }
.score.big .meter i { width: 7px; height: calc(var(--n) * 2px + 2px); }

/* ═══ Search + filters ══════════════════════════════════════════════════════ */
.searchbar { display: flex; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px; }
.searchbar:focus-within { border-color: var(--cobalt); box-shadow: 0 0 0 3px var(--cobalt-soft); }
.searchbar select { width: auto; border: 0; background: var(--surface-2); font-size: 13px; padding: 8px 10px; box-shadow: none !important; }
.searchbar input { border: 0; box-shadow: none !important; font-size: 15.5px; padding: 8px 6px; }
.recent { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; font-size: 13px; }
.recent:empty { display: none; }
.chip-r { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); overflow: hidden; }
.chip-r button { border: 0; background: none; padding: 4px 10px; font-size: 13px; color: var(--ink-2); }
.chip-r button:hover { background: var(--surface-2); color: var(--ink); }
.chip-r button[data-rm] { padding: 4px 8px 4px 2px; color: var(--muted); }
.exclude-row { display: flex; gap: 10px; align-items: center; margin-top: 8px; padding: 0 4px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.exclude-row input { border: 0; border-bottom: 1px dashed var(--line); border-radius: 0; background: none; padding: 5px 2px; font-size: 13.5px; box-shadow: none !important; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; }
.pill { position: relative; }
.pill > button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.pill > button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px; min-width: 240px; max-height: 340px; overflow-y: auto; box-shadow: 0 18px 40px -16px rgba(16,26,51,.35); }
.menu .opt { display: flex; gap: 9px; align-items: center; padding: 7px 8px; border-radius: 8px; font-size: 14px; cursor: pointer; }
.menu .opt:hover { background: var(--surface-2); }
.menu .opt input { accent-color: var(--cobalt); }
.menu .foot { display: flex; justify-content: space-between; border-top: 1px solid var(--line-2); margin-top: 6px; padding-top: 8px; }
.menu p { font-size: 12.5px; color: var(--muted); margin: 6px 8px; }
.search-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; font-size: 13.5px; color: var(--muted); }
.search-meta .sm-note { margin-left: 4px; padding-left: 12px; border-left: 1px solid var(--line); color: var(--warn); }
.addlink { display: flex; gap: 8px; align-items: center; margin-top: 14px; padding: 8px 10px 8px 14px; border: 1px dashed var(--line); border-radius: var(--r-md); background: var(--surface-2); font-size: 13.5px; color: var(--ink-2); }
.addlink label { white-space: nowrap; }
.addlink input { flex: 1; }

/* ═══ Job rows (list) ═══════════════════════════════════════════════════════ */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.row { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 16px; align-items: start; padding: 16px 18px; border-top: 1px solid var(--line-2); cursor: pointer; position: relative; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--surface-2); }
.row[aria-selected="true"] { background: var(--cobalt-soft); }
.row[aria-selected="true"]::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--cobalt); }
.row h3 { font-size: 17.5px; font-weight: 600; line-height: 1.25; }
.row .sub { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 4px; font-size: 13.5px; color: var(--ink-2); }
.row .sub .co { font-weight: 600; color: var(--ink); }
.row .fit { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; align-items: center; font-size: 12.5px; color: var(--muted); }
.row .acts { display: flex; gap: 6px; align-items: center; }
.row.compact { grid-template-columns: 64px minmax(0, 1fr) auto; padding: 12px 16px; }
.row.compact h3 { font-size: 16px; }
.row.leaving { opacity: 0; transform: translateX(12px); transition: opacity .18s, transform .18s; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin: 12px 0; }
.more { display: flex; justify-content: center; padding: 16px; border-top: 1px solid var(--line-2); }

/* ═══ Jobs: two-pane ════════════════════════════════════════════════════════ */
.jobs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(380px, 460px); gap: 22px; align-items: start; }
.detail { position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.detail .empty { padding: 80px 28px; }
.jd-head { padding: 22px 22px 16px; border-bottom: 1px solid var(--line-2); }
.jd-head h2 { font-size: 23px; line-height: 1.2; }
.jd-head .sub { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; color: var(--ink-2); font-size: 14px; }
.jd-head .sub b { color: var(--ink); }
.jd-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.jd-body { padding: 18px 22px 26px; }
.jd-sec { margin-top: 24px; }
.jd-sec:first-child { margin-top: 0; }
.jd-sec h4 { font-family: var(--display); font-size: 15.5px; margin: 0 0 9px; font-weight: 600; }
.why { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; padding: 16px; border-radius: var(--r-md); background: var(--surface-2); }
.parts { display: grid; gap: 6px; }
.part { display: grid; grid-template-columns: 112px 1fr 26px; gap: 10px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.part .track { height: 5px; border-radius: 5px; background: var(--line); overflow: hidden; }
.part .track i { display: block; height: 100%; background: var(--cobalt); border-radius: 5px; }
.part span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; font-size: 14px; margin: 0; }
.facts dt { color: var(--muted); font-size: 12.5px; }
.facts dd { margin: 1px 0 0; color: var(--ink); }
.reasons { margin: 12px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; }
.reasons li { margin: 3px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.desc { white-space: pre-wrap; font-size: 14.5px; line-height: 1.65; color: var(--ink-2); max-width: 68ch; }
.openings { border: 1px solid var(--line); border-radius: var(--r-md); }
.openings > div { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line-2); font-size: 14px; }
.openings > div:first-child { border-top: 0; }

/* Drawer for narrow screens */
.scrim { position: fixed; inset: 0; background: rgba(13,19,36,.45); z-index: 60; opacity: 0; pointer-events: none; transition: opacity .15s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; inset: 0 0 0 auto; width: min(560px, 100vw); background: var(--surface); z-index: 70; transform: translateX(100%); transition: transform .2s ease; overflow: auto; }
.drawer.open { transform: none; }

/* ═══ Dashboard ═════════════════════════════════════════════════════════════ */
.tm-head { display: flex; align-items: center; margin: 0 0 10px; }
.tm-head h2 { font-size: 15px; font-weight: 600; flex: 1; }
.tcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-bottom: 26px; }
.tcards .empty { grid-column: 1 / -1; }
.tcard { background: var(--surface); border: 1px solid var(--line-2); border-radius: 16px; padding: 6px; cursor: pointer; }
.tcard:hover { border-color: var(--line); }
.tcard .tc-top { position: relative; background: var(--tint); color: #111; border-radius: 12px; padding: 14px 16px; min-height: 160px; }
.tcard .tc-top small { display: block; font-size: 12px; opacity: .65; }
.tcard .tc-top h3 { font-size: 15.5px; font-weight: 600; line-height: 1.3; margin-top: 4px; padding-right: 46px; }
.tcard .ring { position: absolute; top: 10px; right: 10px; width: 46px; height: 46px; }
.tcard .ring text { font: 700 12px var(--text); fill: #111; }
.tcard .tc-foot { display: flex; align-items: center; gap: 8px; padding: 10px 8px 6px; font-size: 13px; color: var(--muted); }
.tcard .tc-foot .co { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 7px; align-items: center; }
.tcard .av { flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--cobalt); color: var(--cobalt-ink); font-size: 10px; font-weight: 700; display: grid; place-items: center; }
.searchbar { border-radius: 999px; padding: 4px 6px 4px 16px; }

.dash { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: 22px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line-2); }
.panel-head h2 { font-size: 17px; font-weight: 600; }
.panel-head .spacer { flex: 1; }
.panel-body { padding: 16px 18px; }
.panel .list { border: 0; border-radius: 0 0 var(--r-lg) var(--r-lg); }
.pipeline { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line-2); margin: 4px 0 14px; gap: 2px; }
.pipeline i { display: block; height: 100%; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; font-size: 13.5px; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend b { margin-left: auto; font-variant-numeric: tabular-nums; }
.dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.st-SAVED { --c: #8A93AB; } .st-APPLIED { --c: var(--cobalt); } .st-GHOSTED { --c: #B4BBCC; } .st-INTERVIEWING { --c: var(--signal); }
.st-OFFER { --c: var(--ok); } .st-REJECTED { --c: var(--bad); } .st-ARCHIVED { --c: var(--muted); }
.dot, .pipeline i { background: var(--c); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.status::before { content: ''; width: 8px; height: 8px; border-radius: 3px; background: var(--c); }
.app-row { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line-2); font-size: 14px; cursor: pointer; }
.app-row:first-child { border-top: 0; }
.app-row .t { flex: 1; min-width: 0; }
.app-row .t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app-row .t span { color: var(--muted); font-size: 13px; }
.checklist { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.checklist li { display: flex; gap: 8px; align-items: center; color: var(--ink-2); }
.checklist li::before { content: ''; width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--line); flex: none; }

/* ═══ Tracker ═══════════════════════════════════════════════════════════════ */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 10px; align-items: start; }
.col { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: var(--r-md); padding: 12px; min-height: 160px; max-height: calc(100vh - 210px); overflow-y: auto; }
.col.drop { background: var(--cobalt-soft); }
.col h3 { font-size: 15px; display: flex; justify-content: space-between; margin: 0 2px 12px; }
.col h3 span { color: var(--muted); font-family: var(--text); font-weight: 500; }
.tcard { border: 1px solid var(--line); border-radius: 10px; padding: 11px; margin-bottom: 8px; background: var(--surface); cursor: grab; }
.tcard:hover { border-color: var(--muted); }
.tcard b { display: block; font-size: 14px; line-height: 1.3; }
.tcard .c { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.tcard .d { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; color: var(--muted); }

/* ═══ Profile ═══════════════════════════════════════════════════════════════ */
.switcher { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.switcher select { width: auto; min-width: 200px; font-weight: 600; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 0 0 22px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--cobalt); }
.profile { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 28px; align-items: start; }
.toc { position: sticky; top: 20px; display: grid; gap: 2px; font-size: 14px; }
.toc a { display: flex; justify-content: space-between; gap: 8px; text-decoration: none; color: var(--ink-2); padding: 6px 10px; border-radius: 8px; }
.toc a:hover { background: var(--surface); }
.toc a span { color: var(--muted); font-size: 12.5px; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px 22px; margin-bottom: 16px; scroll-margin-top: 20px; }
.sec-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
.sec-head h2 { font-size: 19px; font-weight: 600; }
.sec-head p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.sec-head .spacer { flex: 1; }
.hero-card { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; }
.initials { width: 64px; height: 64px; border-radius: 18px; background: var(--cobalt); color: var(--cobalt-ink); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 24px; }
.hero-card h1 { font-size: 26px; }
.hero-card .contact { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--ink-2); margin-top: 6px; }
.pct { text-align: right; }
.pct b { font-family: var(--display); font-size: 30px; font-weight: 800; letter-spacing: -0.03em; }
.pct span { display: block; font-size: 12.5px; color: var(--muted); }
.timeline { position: relative; padding-left: 24px; }
.timeline::before { content: ''; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.entry { position: relative; padding: 2px 0 18px; }
.entry:last-child { padding-bottom: 2px; }
.timeline .entry::before { content: ''; position: absolute; left: -24px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--cobalt); }
.timeline .entry.now::before { background: var(--cobalt); }
.entry-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.entry-head h3 { font-size: 16.5px; font-weight: 600; }
.entry-head .when { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; }
.entry .org { color: var(--ink-2); font-size: 14px; margin-top: 1px; }
.entry ul { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; max-width: 76ch; }
.entry ul li { margin: 3px 0; }
.tools { display: inline-flex; gap: 4px; opacity: 0; transition: opacity .12s; }
.entry:hover .tools, .entry:focus-within .tools { opacity: 1; }
.tools .icon-btn { width: 28px; height: 28px; }
.tools .icon-btn svg { width: 14px; height: 14px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px 14px; align-items: start; }
.form-grid .wide { grid-column: 1 / -1; }
.editor { border: 1px solid var(--cobalt); border-radius: var(--r-md); padding: 16px; margin: 4px 0 16px; background: var(--surface-2); }
.editor .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
.ad-group + .ad-group { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line-2); }
.ad-group h3 { font-size: 15.5px; margin-bottom: 4px; }
.ad-group .hint { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
.dropzone { display: grid; place-items: center; gap: 6px; text-align: center; border: 2px dashed var(--line); border-radius: var(--r-lg); padding: 36px 20px; color: var(--ink-2); cursor: pointer; }
.dropzone.over { border-color: var(--cobalt); background: var(--cobalt-soft); }
.dropzone b { font-family: var(--display); font-size: 18px; color: var(--ink); }
.resume-text { white-space: pre-wrap; font-size: 13px; line-height: 1.55; max-height: 420px; overflow: auto; background: var(--surface-2); border-radius: var(--r-md); padding: 14px; color: var(--ink-2); }


/* ═══ Resume tab: page preview + layout tools (like Tsenta's) ══════════════ */
.rz-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.rz-top .spacer { flex: 1; }
.rz-note { margin: 0; font-size: 13px; color: var(--muted); }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(16,26,51,.12); }
.rz-tools { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.rz-tools .grp { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }
.rz-tools select { width: 9.5em; padding: 6px 26px 6px 9px; font-size: 13px; }
.rz-size { display: inline-flex; align-items: center; gap: 4px; }
.rz-size .icon-btn { width: 28px; height: 28px; }
.rz-size output { min-width: 48px; text-align: center; font-size: 13px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.rz-tools .switch { font-size: 13px; color: var(--ink-2); }
.rz-tools .switch .track { width: 36px; height: 21px; }
.rz-tools .switch .track::after { width: 15px; height: 15px; }
.rz-tools .switch input:checked + .track::after { transform: translateX(15px); }
.rz-tools .spacer { flex: 1; }
.rz-pop { position: relative; }
.rz-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; width: 290px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: 0 12px 32px rgba(16,26,51,.16); padding: 10px; }
.rz-menu.right { left: auto; right: 0; }
.rz-menu h4 { margin: 4px 6px 8px; font: 600 12px/1.4 var(--text); color: var(--muted); }
.rz-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.rz-list li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); font-size: 13.5px; }
.rz-list li.off span.name { color: var(--muted); text-decoration: line-through; }
.rz-list li.drag-over { border-color: var(--cobalt); }
.rz-list .handle { cursor: grab; color: var(--muted); font-size: 11px; letter-spacing: -2px; user-select: none; }
.rz-list .num { width: 16px; color: var(--muted); font-size: 12px; text-align: right; }
.rz-list .name { flex: 1; }
.eye { border: 0; background: none; padding: 2px; color: var(--ink-2); display: inline-grid; place-items: center; border-radius: 6px; }
.eye svg { width: 17px; height: 17px; }
.eye[aria-pressed="false"] { color: var(--muted); }
.rz-menu .row-btn { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; padding: 8px 6px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--cobalt); text-align: left; }
.rz-menu .row-btn:hover { background: var(--surface-2); }
.rz-menu hr { border: 0; border-top: 1px solid var(--line-2); margin: 8px 0; }
.rz-canvas { margin-top: 14px; padding: 24px 12px 36px; border-radius: var(--r-lg); background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.rz-paper { margin: 0 auto; width: 816px; transform-origin: top left; }
.rz-paper iframe { display: block; width: 816px; border: 0; background: #fff; border-radius: 4px; box-shadow: 0 1px 3px rgba(16,26,51,.12), 0 10px 30px rgba(16,26,51,.10); }
.rz-pages { text-align: center; font-size: 12.5px; color: var(--muted); margin: 10px 0 0; }
.rz-pages.over { color: var(--warn); font-weight: 600; }
.rz-editbar { flex-basis: 100%; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border-radius: var(--r-md); background: var(--cobalt-soft); color: var(--cobalt); font-size: 13.5px; }
.rz-editbar .spacer { flex: 1; }
.rz-original { width: 816px; min-height: 1056px; margin: 0 auto; padding: 48px 58px; background: #fff; color: #111; font: 12.5px/1.55 Arial, sans-serif; white-space: pre-wrap; border-radius: 4px; box-shadow: 0 1px 3px rgba(16,26,51,.12); }
.rz-examples > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; }
.rz-examples > summary::-webkit-details-marker { display: none; }
.rz-examples > summary h2 { font-size: 17px; font-weight: 600; }
.rz-examples > summary::after { content: '▾'; margin-left: auto; color: var(--muted); }
.rz-examples[open] > summary::after { content: '▴'; }
.rz-examples[open] > summary { margin-bottom: 14px; }
@media (max-width: 860px) {
  .rz-tools { position: static; }
  .rz-menu { width: min(290px, calc(100vw - 48px)); }
}

/* ═══ Auto-apply + application detail ══════════════════════════════════════ */
.aa { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(320px, 1fr); gap: 22px; align-items: start; }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 44px; height: 26px; border-radius: 13px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.switch .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch input:checked + .track { background: var(--cobalt); }
.switch input:checked + .track::after { transform: translateX(18px); }
.switch input:focus-visible + .track { outline: 2px solid var(--cobalt); outline-offset: 2px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 22px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; }
.stat b { display: block; font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.stat.attn b { color: var(--bad); }
.qitem { padding: 14px 18px; border-top: 1px solid var(--line-2); }
.qitem:first-child { border-top: 0; }
.qitem .top { display: flex; gap: 12px; align-items: flex-start; }
.qitem .top .t { flex: 1; min-width: 0; }
.qitem h3 { font-size: 16px; font-weight: 600; line-height: 1.3; }
.qitem .meta { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.qitem .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.qitem .why-stop { font-size: 14px; color: var(--ink-2); margin: 8px 0 0; }
.qform { display: grid; gap: 12px; margin-top: 12px; padding: 14px; border-radius: var(--r-md); background: var(--surface-2); }
.filled { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 10px; }
.filled td { padding: 6px 8px; border-top: 1px solid var(--line-2); vertical-align: top; }
.filled td:first-child { color: var(--muted); width: 48%; }
.filled tr.src-saved td:last-child::after { content: ' · your saved answer'; color: var(--muted); font-size: 12px; }
.badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.badge.you { background: var(--bad-soft); color: var(--bad); }
.badge.review { background: var(--signal-soft); color: var(--signal-ink); }
.badge.sent { background: var(--ok-soft); color: var(--ok); }
.badge.wait { background: var(--cobalt-soft); color: var(--cobalt); }
.badge.off { background: var(--surface-2); color: var(--muted); }
.lane { border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; margin-top: 12px; background: var(--surface); }
.lane[data-off="true"] { opacity: .7; }
.lane .lane-head { display: flex; gap: 10px; align-items: center; }
.lane .lane-head input[name=name] { font-weight: 600; font-size: 15px; }
.lane .opts { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 10px; }
.plan-lane + .plan-lane { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line-2); }
.plan-lane ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
.plan-lane .skips { font-size: 13px; color: var(--muted); margin-top: 6px; }
.events { list-style: none; margin: 0; padding: 0 0 0 20px; position: relative; font-size: 14px; }
.events::before { content: ''; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.events li { position: relative; padding: 0 0 12px; }
.events li::before { content: ''; position: absolute; left: -20px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--cobalt); }
.events li:last-child::before { background: var(--cobalt); }
.events small { display: block; color: var(--muted); font-size: 12.5px; }
.letter { white-space: pre-wrap; font-size: 14px; line-height: 1.6; background: var(--surface-2); border-radius: var(--r-md); padding: 14px; color: var(--ink-2); }
.tailor-box { border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; background: var(--surface-2); }
.tailor-box .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
.tailor-box .row2 > .btn { grid-column: 1 / -1; justify-self: start; }
.added-list { margin: 8px 0 0; padding-left: 18px; font-size: 14px; display: grid; gap: 6px; }
.added-list small { display: block; color: var(--muted); font-size: 12px; }
/* Applied */
.ap-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0 6px; }
.ap-controls .spacer { flex: 1; }
.ap-controls select { width: auto; font-size: 13.5px; padding: 7px 10px; }
.ap-fields { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--ink-2); }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.fchip .n { font-weight: 700; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(16, 26, 51, .12); }
.ap-line { margin: 6px 0 12px; font-size: 14px; color: var(--ink-2); min-height: 1.4em; }
.ap-list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.ap-list:empty { display: none; }
.ap-row, .ap-co { font-family: var(--text); display: flex; gap: 14px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line-2); padding: 14px 18px; align-items: flex-start; cursor: pointer; color: inherit; }
.ap-row:first-child, .ap-co:first-child { border-top: 0; }
.ap-row:hover, .ap-co:hover { background: var(--surface-2); }
.ap-date { width: 64px; flex: none; font-size: 13px; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.ap-main, .co-main { flex: 1; min-width: 0; display: grid; gap: 4px; }
.ap-main h3, .co-main h3 { font-family: var(--display); font-size: 16px; font-weight: 600; margin: 0; }
.ap-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13.5px; color: var(--muted); }
.ap-meta b { color: var(--ink-2); font-weight: 600; }
.ap-meta span::before { content: '·'; margin-right: 10px; opacity: .6; }
.ap-hits { display: flex; gap: 5px; flex-wrap: wrap; }
.snip { margin: 2px 0 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
.snip mark { background: var(--signal-soft); color: var(--signal-ink); border-radius: 3px; padding: 0 2px; }
.ap-side { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; align-items: center; max-width: 230px; }
.have { font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; padding: 1px 7px; }
.have.yes { color: var(--ok); background: var(--ok-soft); border: 1px solid transparent; }
.co-n { width: 64px; flex: none; display: grid; font-size: 12px; color: var(--muted); }
.co-n b { font-family: var(--display); font-size: 22px; color: var(--ink); line-height: 1.1; }
.co-when { display: grid; justify-items: end; gap: 6px; font-size: 13px; }
#apMore { margin: 14px 0 0; }
.jd-actions .move { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); margin-left: auto; }
.jd-actions .move select { width: auto; padding: 6px 8px; font-size: 13px; }
.cov { display: flex; align-items: baseline; gap: 8px; margin: 12px 0 6px; }
.cov b { font-family: var(--display); font-size: 26px; font-weight: 700; }
.tcard .aa-badge { margin-top: 8px; }



/* ═══ Tsenta-style dashboard ════════════════════════════════════════════════ */
/* Horizontal top-match strip */
.top-strip { display: flex; gap: 14px; overflow-x: auto; padding: 4px 0 10px; margin: 0 0 24px; scrollbar-width: none; }
.top-strip::-webkit-scrollbar { display: none; }
.top-strip .tcard { flex: 1 0 250px; display: flex; flex-direction: column; }
.top-strip .tcard .tc-top { min-height: 150px; flex: 1; }
.top-strip .tcard .tc-meta { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; padding-right: 50px; font-size: 11px; white-space: nowrap; }
.top-strip .tcard .tc-top h3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.top-strip .tcard .tc-top small { font-size: 11px; letter-spacing: .02em; text-transform: uppercase; opacity: .6; }
.top-strip .tcard .tc-top h3 { font-size: 16px; margin-top: 4px; }

<script>
// ═══ State + helpers ════════════════════════════════════════════════════════
const API = '/v1';
const store = {
  get(k, d) { try { const v = localStorage.getItem('jd.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('jd.' + k, JSON.stringify(v)); } catch {} },
};
let USER = store.get('userId', null);
if (!USER) { USER = crypto.randomUUID ? crypto.randomUUID() : '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, c => (c ^ Math.random() * 16 >> c / 4).toString(16)); store.set('userId', USER); }

const state = {
  profile: null, profileSkills: null, apps: { counts: {}, applications: [] },
  search: store.get('search', { include: '', exclude: '', scope: 'title' }), saved: null, posted: store.get('posted', 30),
  feed: null, cursor: null, selected: null,

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function api(method, path, body) {

  for (let attempt = 0; ; attempt++) {
    try { res = await fetch(API + path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined }); }
    catch (e) { if (method !== 'GET' || attempt >= 2) throw e; res = null; }
    if (res && (res.status < 500 || method !== 'GET' || attempt >= 2)) break;
    await new Promise(r => setTimeout(r, 1500 * (attempt + 1)));

  if (!res.ok && res.status !== 422) throw Object.assign(new Error(data?.error || data?.errors?.join(', ') || `Request failed (${res.status})`), { status: res.status, data });

}
function toast(msg) { $$('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
function ago(d) {
  if (!d) return ''; const s = (Date.now() - new Date(d)) / 1000;
  if (s < 3600) return `${Math.max(1, Math.round(s / 60))} min ago`; if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  const days = Math.round(s / 86400); return days === 1 ? 'yesterday' : days < 60 ? `${days} days ago` : `${Math.round(days / 30)} months ago`;
}
function money(sal) {
  if (!sal || (sal.minAnnual == null && sal.maxAnnual == null)) return null;
  const k = v => (v == null ? null : `$${Math.round(v / 1000)}k`);
  return [k(sal.minAnnual), k(sal.maxAnnual)].filter(Boolean).join('–') + ' a year';
}
const ACRONYMS = { Ai: 'AI', Ml: 'ML', Qa: 'QA', Sre: 'SRE', Sdet: 'SDET', Ui: 'UI', Mlops: 'MLOps', Etl: 'ETL', Devops: 'DevOps', It: 'IT', Us: 'US' };
const pretty = s => (String(s) === 'ONSITE' ? 'On-site' : String(s || '').replace(/_/g, ' ').toLowerCase().replace(/\b\w+/g, w => ACRONYMS[w[0].toUpperCase() + w.slice(1)] || w[0].toUpperCase() + w.slice(1)));
const humanize = s => String(s || '').replace(/\b[A-Z]+(?:_[A-Z]+)+\b/g, m => pretty(m));
const jobSkills = j => [...(j.skills?.required || []), ...(j.skills?.preferred || []), ...(j.skills?.mentioned || [])];
const tier = s => (s >= 80 ? 'strong' : s >= 65 ? 'good' : 'weak');

  const v = Math.max(0, Math.min(100, Math.round(n || 0))); const on = Math.round(v / 10);
  return `<div class="score tier-${tier(v)}${big ? ' big' : ''}" role="img" aria-label="${v}% match"><b>${v}<small>%</small></b><span class="meter" aria-hidden="true">${Array.from({ length: 10 }, (_, i) => `<i class="${i < on ? 'on' : ''}" style="--n:${i + 1}"></i>`).join('')}</span></div>`;
}
function whereText(j) {
  return j.locationText || [j.locations?.[0]?.city, j.locations?.[0]?.stateCode].filter(Boolean).join(', ') || (j.workplace === 'REMOTE' ? 'Remote' : '');
}
const svg = (inner, size = 16, w = 2) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" aria-hidden="true">${inner}</svg>`;
const I = {
  x: s => svg('<path d="M6 6l12 12M18 6L6 18"/>', s, 2.2),
  save: s => svg('<path d="M6 3h12v18l-6-4-6 4z"/>', s),
  ext: s => svg('<path d="M14 4h6v6M20 4l-9 9M19 14v6H4V5h6"/>', s),
  edit: s => svg('<path d="M4 20h4L19 9l-4-4L4 16z"/>', s),
  up: s => svg('<path d="M6 15l6-6 6 6"/>', s),
  trash: s => svg('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>', s),
  chev: s => svg('<path d="M6 9l6 6 6-6"/>', s, 2.5),

// ═══ Data ═══════════════════════════════════════════════════════════════════
async function loadProfile() {
  const [{ data: profile }, { data: saved }] = await Promise.all([api('GET', `/users/${USER}/profile`), api('GET', `/users/${USER}/search`)]);
  state.profile = profile; state.saved = saved?.active ? saved : null;
  if (state.saved && !state.search.include && !state.search.exclude) state.search = { include: saved.include.join(' | '), exclude: saved.exclude.join(' | '), scope: saved.scope };
}

  if (state.profileSkills) return;
  const { data } = await api('GET', `/users/${USER}/skills`);
  state.profileSkills = (data || []).map(s => s.canonical_name.toLowerCase());
}
async function loadApps() {
  const { data } = await api('GET', `/users/${USER}/applications`);
  state.apps = data;
  const c = data.counts; const active = (c.APPLIED || 0) + (c.INTERVIEWING || 0) + (c.OFFER || 0);
  $('#appliedCount').textContent = active ? String(active) : '';
  if ($('#appTbody')) drawDashApps(); // refresh dashboard table if visible
}

  try {
    const { data } = await api('GET', `/users/${USER}/resume-profiles`);
    state.resumeProfiles = data;
    const d = data.find(p => p.isDefault); const el = $('#railProfile');
    if (!d) { el.style.display = 'none'; return; }

    el.innerHTML = `<b>${esc(d.name)} profile</b><span class="muted">${d.completeness.percent}% complete</span><div class="bar"><i style="width:${d.completeness.percent}%"></i></div>`;
  } catch {}
}
function feedQuery(extra = {}) {
  const p = new URLSearchParams();
  const split = s => s.split('|').map(x => x.trim()).filter(Boolean).join('|');
  const inc = split(state.search.include), exc = split(state.search.exclude);
  if (inc || exc) { p.set('search', inc); p.set('exclude_search', exc); p.set('search_scope', state.search.scope); }
  else p.set('use_saved_search', 'false');
  if (state.posted) p.set('posted_within_days', state.posted);
  for (const [k, v] of Object.entries(extra)) if (v != null) p.set(k, v);
  return p.toString();
}
async function loadFeed({ append = false, limit = 25 } = {}) {
  const { data } = await api('GET', `/users/${USER}/recommendations?${feedQuery({ limit, cursor: append ? state.cursor : null })}`);
  state.cursor = data.nextCursor;
  if (append && state.feed) { state.feed.jobs.push(...data.jobs); state.feed.nextCursor = data.nextCursor; } else state.feed = data;
  return state.feed;
}

// ═══ Router ═════════════════════════════════════════════════════════════════
const ROUTES = { dashboard: renderDashboard, jobs: renderJobs, browse: renderJobs, tracker: renderTracker, applied: renderApplied, 'auto-apply': renderAutoApply, review: renderReview, sent: renderSent, profile: renderProfile, settings: renderSettings };
async function route() {
  const name = location.hash.replace(/^#\/?/, '').split(/[/?]/)[0] || 'dashboard';
  const view = ROUTES[name] ? name : 'dashboard';
  const navKey = view === 'browse' ? 'jobs' : view === 'review' ? 'dashboard' : view === 'sent' ? 'applied' : view;
  $$('#nav a, .rail-foot [data-route]').forEach(a => { if (a.dataset.route === navKey) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  closeDrawer(true);
  state.selected = null;
  const mine = ++state.routeSeq;
  // Renders run one at a time and a superseded one never starts. A slow page (the dashboard waiting on
  // job matches) only holds the next one for a moment: its late updates target its own elements, and
  // anything it throws after you left is ignored below.
  const prev = state.routeChain;
  let done; state.routeChain = new Promise(r => done = r);
  await Promise.race([prev, new Promise(r => setTimeout(r, 600))]);
  if (mine !== state.routeSeq) return done();
  try {
    if (!state.profile && view !== 'profile') await loadProfile();
    if (!state.profile && view !== 'profile') { location.hash = '#/profile'; return done(); }
    delete $('#view').dataset.review;
    await ROUTES[view]();
  } catch (e) {
    if (mine !== state.routeSeq) return done();   // a page you already left failed late: not this page's problem
    $('#view').innerHTML = `<div class="notice bad">This page couldn't load: ${esc(e.message)}. The server may be busy, so this is usually temporary. <button class="btn" id="retryRoute" type="button">Try again</button></div>`;
    $('#retryRoute')?.addEventListener('click', route);
  }
  done();
  loadRailProfile(); loadApps().catch(() => {});
  const jm = location.hash.match(/job=(\d+)/); if (jm) openJob(jm[1]);
}
window.addEventListener('hashchange', route);

// ═══ Search + filters ═══════════════════════════════════════════════════════
const DATE_OPTS = [[1, 'Past 24 hours'], [3, 'Past 3 days'], [7, 'Past week'], [14, 'Past 2 weeks'], [30, 'Past month'], [0, 'Any time']];
const WORKPLACES = [['REMOTE', 'Remote'], ['HYBRID', 'Hybrid'], ['ONSITE', 'On-site']];
const COUNTRIES = [['US', 'United States'], ['CA', 'Canada'], ['GB', 'United Kingdom'], ['IE', 'Ireland'], ['DE', 'Germany'], ['FR', 'France'], ['NL', 'Netherlands'], ['ES', 'Spain'], ['IT', 'Italy'], ['PT', 'Portugal'], ['SE', 'Sweden'], ['PL', 'Poland'], ['CH', 'Switzerland'], ['AU', 'Australia'], ['IN', 'India'], ['SG', 'Singapore'], ['JP', 'Japan'], ['IL', 'Israel'], ['BR', 'Brazil'], ['MX', 'Mexico']];
const EMPLOYMENT = [['FULL_TIME', 'Full time'], ['CONTRACT', 'Contract'], ['PART_TIME', 'Part time'], ['INTERNSHIP', 'Internship']];

function searchHTML() {
  const p = state.profile || {};
  const wp = p.remote_only ? ['REMOTE'] : (p.preferred_workplace_types || []); const emp = p.preferred_employment_types || [];
  const pill = (key, label, on) => `<div class="pill"><button type="button" data-pill="${key}" aria-pressed="${!!on}" aria-haspopup="true">${esc(label)}${I.chev(12)}</button></div>`;
  return `
  <form class="searchbar" id="searchForm" role="search">
    <select id="scope" aria-label="Search in" style="width:auto;min-width:max-content"><option value="title">Titles</option><option value="title_description">Titles and descriptions</option><option value="description">Descriptions</option></select>
    <input id="q" type="search" placeholder="Search roles or skills (separate several with |), or paste a job link" autocomplete="off" value="${esc(state.search.include)}" aria-label="Search" />
    <button class="btn quiet" id="addTerm" type="button" title="Add another title or keyword (matches any)">+ Add</button>
    <button class="btn primary" type="submit">Search</button>
  </form>
  <div class="recent" id="recent" aria-label="Recent searches"></div>
  <div class="exclude-row"><label for="ex">Hide jobs mentioning</label><input id="ex" type="text" placeholder="senior | staff" value="${esc(state.search.exclude)}" /></div>
  <div class="filters">
    ${pill('date', DATE_OPTS.find(d => d[0] === Number(state.posted))?.[1] || 'Date posted', Number(state.posted) !== 30)}
    ${pill('workplace', wp.length ? wp.map(w => pretty(w)).join(', ') : 'Workplace', wp.length)}
    ${pill('employment', emp.length ? emp.map(e => pretty(e)).join(', ') : 'Job type', emp.length)}
    ${pill('country', (p.allowed_countries || []).length ? p.allowed_countries.join(', ') : 'Country', (p.allowed_countries || []).length)}
    ${pill('experience', p.max_experience_required != null ? `Up to ${p.max_experience_required} yrs required` : 'Experience required', p.max_experience_required != null)}
    ${pill('salary', p.salary_is_hard_constraint && p.min_salary ? `$${Math.round(p.min_salary / 1000)}k or more` : 'Salary', p.salary_is_hard_constraint && p.min_salary)}
    ${pill('visa', p.needs_sponsorship ? 'Sponsors visas' : 'Visa', p.needs_sponsorship)}
    ${pill('clearance', p.exclude_clearance_jobs ? 'No clearance' : 'Clearance', p.exclude_clearance_jobs)}
    <span style="flex:1"></span>
    <button class="btn sm quiet" id="saveSearch" type="button">${state.saved ? 'Saved search on' : 'Save this search'}</button>
  </div>
  <div id="searchMeta"></div>
`;
}
// The titles and roles you search for are kept, with the filters you had on, so one click brings both back.
const FILTER_KEYS = ['remote_only', 'preferred_workplace_types', 'preferred_employment_types', 'allowed_countries', 'max_experience_required', 'min_salary', 'salary_is_hard_constraint', 'exclude_clearance_jobs'];
const snapFilters = () => ({ posted: state.posted, visa: !!state.profile?.needs_sponsorship, prefs: Object.fromEntries(FILTER_KEYS.map(k => [k, state.profile?.[k] ?? null])) });
const recentOf = () => store.get('recent', []).map(r => (typeof r === 'string' ? { q: r } : r));
const filterSummary = f => !f ? '' : [Number(f.posted) !== 30 && DATE_OPTS.find(d => d[0] === Number(f.posted))?.[1], (f.prefs.allowed_countries || []).length && (f.prefs.allowed_countries || []).join(', '),
  (f.prefs.preferred_workplace_types || []).length && f.prefs.preferred_workplace_types.map(pretty).join('/'), f.visa && 'visa', f.prefs.max_experience_required != null && `≤${f.prefs.max_experience_required} yrs`].filter(Boolean).join(' · ');
function rememberSearch() {
  store.set('search', state.search);
  const q = state.search.include.trim();
  if (!q || /^https?:\/\//i.test(q)) return;
  const entry = { q, ex: state.search.exclude, scope: state.search.scope, f: snapFilters() };
  store.set('recent', [entry, ...recentOf().filter(r => r.q.toLowerCase() !== q.toLowerCase())].slice(0, 8));
  renderRecent();
}
async function applyRecent(r) {
  state.search = { include: r.q, exclude: r.ex || '', scope: r.scope || 'title' }; store.set('search', state.search);
  if (r.f) {
    state.posted = r.f.posted; store.set('posted', state.posted);
    await savePrefs(r.f.prefs); await saveProfileField({ needs_sponsorship: r.f.visa });
  }
  // Handle post-OAuth redirect (?gmail=connected)
(function() {
  const p = new URLSearchParams(location.search);
  if (p.get('gmail') === 'connected') {
    history.replaceState(null, '', location.pathname + location.hash);
    // the server sends you back to #/settings
    toast('Gmail connected successfully!');
  }
})();
route();
}
function renderRecent() {
  const host = $('#recent'); if (!host) return;
  const list = recentOf();
  host.innerHTML = list.length ? `<span class="muted">Recent</span>${list.map((r, i) => `<span class="chip-r"><button type="button" data-i="${i}" title="${esc(filterSummary(r.f) || 'No filters')}">${esc(r.q)}</button><button type="button" data-rm="${i}" aria-label="Remove ${esc(r.q)}">×</button></span>`).join('')}<button type="button" class="btn sm quiet" data-clear-recent>Clear</button>` : '';
}
function bindSearch(onChange) {
  $('#scope').value = state.search.scope;
  $('#searchForm').addEventListener('submit', e => {
    e.preventDefault();
    const q = $('#q').value.trim();
    if (/^https?:\/\//i.test(q)) return importLink(q, e.submitter);
    state.search = { include: $('#q').value, exclude: $('#ex').value, scope: $('#scope').value }; rememberSearch(); onChange();
  });
  $('#addTerm').addEventListener('click', () => { const q = $('#q'); q.value = q.value.trim().replace(/\|$/, '').trim(); q.value += q.value ? ' | ' : ''; q.focus(); });
  renderRecent();
  $('#recent').addEventListener('click', e => {
    const x = e.target.closest('[data-rm]'); const go = e.target.closest('[data-i]');
    if (x) { store.set('recent', recentOf().filter((_, i) => i !== Number(x.dataset.rm))); return renderRecent(); }
    if (e.target.closest('[data-clear-recent]')) { store.set('recent', []); return renderRecent(); }
    if (go) applyRecent(recentOf()[Number(go.dataset.i)]);
  });
  $('#ex').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#searchForm').requestSubmit(); } });
  $('#scope').addEventListener('change', () => { if ($('#q').value || $('#ex').value) $('#searchForm').requestSubmit(); });
  $('#saveSearch').addEventListener('click', async () => {
    state.search = { include: $('#q').value, exclude: $('#ex').value, scope: $('#scope').value }; rememberSearch();
    const split = s => s.split('|').map(x => x.trim()).filter(Boolean);
    const { status, data } = await api('PUT', `/users/${USER}/search`, { include: split(state.search.include), exclude: split(state.search.exclude), scope: state.search.scope });
    if (status === 422) return toast(data.message || 'That search returns no jobs, so it wasn\'t saved.');
    state.saved = data.saved ? data.keywordSearch : null;
    toast(data.cleared ? 'Saved search turned off.' : `Search saved. ${data.preview.total} jobs match it.`);
    $('#saveSearch').textContent = state.saved ? 'Saved search on' : 'Save this search';
  });
  $$('[data-pill]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); openFilterMenu(b.dataset.pill, b.parentElement, onChange); }));
}
function closeMenus() { $$('.pill .menu').forEach(m => m.remove()); }
document.addEventListener('click', e => { if (!e.target.closest('.menu')) closeMenus(); });
async function savePrefs(patch) { await api('PUT', `/users/${USER}/profile/preferences`, patch); Object.assign(state.profile, patch); }
async function saveProfileField(patch) { const p = { ...state.profile, ...patch }; await api('PUT', `/users/${USER}/profile`, profileBody(p)); Object.assign(state.profile, patch); }
function profileBody(p) {
  const keys = ['current_title', 'total_experience_years', 'highest_education_level', 'current_city', 'current_state', 'current_country', 'work_authorization', 'needs_sponsorship', 'full_name', 'email', 'phone', 'summary', 'open_to_work',
    'preferred_workplace_types', 'preferred_employment_types', 'preferred_states', 'preferred_cities', 'remote_only', 'min_salary', 'salary_is_hard_constraint', 'max_experience_required', 'exclude_clearance_jobs', 'excluded_companies', 'excluded_role_families', 'allowed_countries'];
  return Object.fromEntries(keys.map(k => [k, p?.[k] ?? (/preferred_|excluded_|allowed_/.test(k) ? [] : null)]));
}

function bindRows(root) {
  const find = id => state.feed?.jobs.find(j => j.jobId === id) || { jobId: id };
  root.addEventListener('click', async e => {
    if (e.target.closest('[data-jdetail]')) { openJob(e.target.closest('[data-jdetail]').dataset.jdetail); return; }
    const btn = e.target.closest('[data-pass],[data-apply],[data-save],[data-link]');
    if (btn) {
      e.stopPropagation();
      const id = btn.dataset.pass || btn.dataset.apply || btn.dataset.save;
      try {
        if (btn.dataset.link) { window.open(btn.dataset.url || `https://google.com/search?q=${encodeURIComponent(btn.closest('[data-job]')?.querySelector('h3')?.textContent||'')}`, '_blank', 'noopener'); return; }

        if (btn.dataset.apply) {
          const rowEl = btn.closest('[data-job]');
          const cardFoot = btn.closest('.jc-foot') || btn.closest('.jc')?.querySelector('.jc-foot') || null;

}
function removeRow(id) {

// ─── Live-status tracker for in-flight auto-apply jobs ─────────────────────
const _applyPollers = new Map(); // jobId → intervalId
function _applyStatus(jobId, appId, cardFoot, rowEl) {
  const LABELS = {
    QUEUED:      ['queued',  '<span class="spin"></span> Tailoring resume…'],
    PREPARED:    ['working', '<span class="spin"></span> Opening the form…'],
    SUBMITTING:  ['working', '<span class="spin"></span> Filling form…'],
    NEEDS_REVIEW:['working', '👀 Ready: review &amp; submit'],
    NEEDS_YOU:   ['failed',  '🛑 Needs your input'],
    SUBMITTED:   ['done',    '✅ Applied!'],
    FAILED:      ['failed',  '❌ Failed: see Applications'],
    SKIPPED:     ['done',    'Skipped'],
  };
  const render = state => {
    const [cls, text] = LABELS[state] || ['queued', state];
    const badge = `<span class="apply-status ${cls}">${text}</span>`;
    if (cardFoot) {
      // replace Apply btn with badge, keep Pass btn
      const applyBtn = cardFoot.querySelector('[data-apply]');
      if (applyBtn) applyBtn.replaceWith(Object.assign(document.createElement('span'), { className: `apply-status ${cls}`, innerHTML: text }));
      else { const s = cardFoot.querySelector('.apply-status'); if (s) { s.className = `apply-status ${cls}`; s.innerHTML = text; } }
    }
    if (rowEl) {
      const acts = rowEl.querySelector('.acts');
      if (acts) {
        const old = acts.querySelector('.apply-status'); if (old) old.remove();
        const s = document.createElement('span'); s.className = `apply-status ${cls}`; s.innerHTML = text;
        acts.appendChild(s);
        const applyBtn = acts.querySelector('[data-apply]'); if (applyBtn) applyBtn.remove();
      }
    }
  };
  render('QUEUED');
  const startedAt = Date.now();
  const poll = async () => {
    try {
      const { data } = await api('GET', `/users/${USER}/applications/${appId}`);
      const s = data?.applyState;
      render(s || 'QUEUED');
      if (['SUBMITTED','FAILED','SKIPPED','NEEDS_YOU','NEEDS_REVIEW'].includes(s) || Date.now() - startedAt > 10 * 60_000) {
        clearInterval(_applyPollers.get(jobId)); _applyPollers.delete(jobId);
        if (s === 'SUBMITTED') removeRow(jobId);
        if (s === 'NEEDS_REVIEW') toast('Form filled. Review and submit it under Applications → Needs you.');
        if (s === 'FAILED') toast(data.applyDetail?.reason || 'That application failed.');
        loadApps();
      }
    } catch { /* network blip, keep polling */ }
  };
  const id = setInterval(poll, 2500);
  _applyPollers.set(jobId, id);
  setTimeout(poll, 400); // first check soon
}

async function applyTo(job, { cardFoot = null, rowEl = null } = {}) {
  // Create application record
  const { data: created } = await api('POST', `/users/${USER}/applications`, { jobId: job.jobId, status: 'SAVED' });
  const appId = created?.id;
  if (!appId) { toast('Could not start application.'); return; }

  // Start live status badge
  _applyStatus(job.jobId, appId, cardFoot, rowEl);

  // The server tailors, fills the form and stops for your review; the badge just follows its state.
  api('POST', `/users/${USER}/applications/${appId}/apply`, {})
    .catch(err => { toast(err.message); loadApps(); });

  loadApps();
}
async function importLink(url, button, description = '') {
  const label = button?.textContent; if (button) { button.disabled = true; button.textContent = 'Checking link…'; }
  try {
    const res = await fetch(`${API}/jobs/import`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url, description }) });
    const data = await res.json();
    if (data.jobId) {
      toast(data.company?.added ? `Job added. ${data.company.name} will now be scanned automatically.` : 'Job added.');
      if ($('#q')?.value.trim() === url) $('#q').value = '';
      openJob(data.jobId);
      return true;
    }
    toast(data.message || 'That link couldn\'t be added.');
    if (data.code === 'PAGE_UNREADABLE' && !$('#linkModal')) openLinkModal(url);
  } catch (err) { toast(err.message); }
  finally { if (button) { button.disabled = false; button.textContent = label; } }
  return false;
}

  const m = /(\d{1,2})\s*(?:(?:-|–|to)\s*(\d{1,2}))?\s*\+?\s*(?:years?|yrs?)\b[^.\n]{0,60}?experience|experience[^.\n]{0,40}?(\d{1,2})\s*(?:(?:-|–|to)\s*(\d{1,2}))?\s*\+?\s*(?:years?|yrs?)\b/i.exec(j.description || '');
  if (!m) return null;
  const a = m[1] ?? m[3], b = m[2] ?? m[4];
  return { text: b ? `${a}–${b} years` : `${a}+ years`, fromDescription: true };
}

function drawDashApps() {
  const tbody = $('#appTbody'); if (!tbody) return;
  const { applications, counts } = state.apps || {};
  const allApps = applications || [];

  // Update tab counts
  const submitted = allApps.filter(a => a.status === 'APPLIED').length;
  const inFlight  = allApps.filter(a => ['QUEUED','PREPARED','SUBMITTING'].includes(a.applyState)).length;
  const needsYou  = allApps.filter(a => ['NEEDS_YOU','NEEDS_REVIEW'].includes(a.applyState)).length;
  const failed    = allApps.filter(a => a.applyState === 'FAILED' || (a.status !== 'APPLIED' && a.applyState === 'FAILED')).length;
  const skipped   = allApps.filter(a => a.status === 'SKIPPED' || a.applyState === 'SKIPPED').length;
  const tabCounts = { all: allApps.length, APPLIED: submitted, in_flight: inFlight, needs_you: needsYou, FAILED: failed, SKIPPED: skipped };
  _DASH_TABS.forEach(([k]) => { const el = $(`#tn-${k}`); if (el) el.textContent = tabCounts[k] ? ` ${tabCounts[k]}` : ''; });

  // Approve all: submit everything that's filled and waiting for your OK
  const approveBtn = $('#approveAllBtn');
  const toReview = allApps.filter(a => a.applyState === 'NEEDS_REVIEW');
  if (approveBtn) {
    approveBtn.disabled = !toReview.length; approveBtn.style.opacity = toReview.length ? '1' : '.4';
    approveBtn.textContent = toReview.length ? `✓ Submit all ${toReview.length}` : '✓ Submit all';
    approveBtn.onclick = async () => {
      approveBtn.disabled = true;
      for (const a of toReview) await api('POST', `/users/${USER}/applications/${a.id}/approve`, {}).catch(err => toast(err.message));
      toast(`Submitting ${toReview.length}…`); loadApps();
    };
  }
  // Something is filling a form right now: look again shortly so it moves to the next list by itself.
  clearTimeout(state.appsTimer);
  if (inFlight) state.appsTimer = setTimeout(() => { if ($('#appTbody')) loadApps(); }, 4000);

  // Filter
  let rows = allApps;
  if (_dashTab.active === 'APPLIED')    rows = allApps.filter(a => a.status === 'APPLIED');
  if (_dashTab.active === 'in_flight')  rows = allApps.filter(a => ['QUEUED','PREPARED','SUBMITTING'].includes(a.applyState));
  if (_dashTab.active === 'needs_you')  rows = allApps.filter(a => ['NEEDS_YOU','NEEDS_REVIEW'].includes(a.applyState));
  if (_dashTab.active === 'FAILED')     rows = allApps.filter(a => a.applyState === 'FAILED');
  if (_dashTab.active === 'SKIPPED')    rows = allApps.filter(a => a.status === 'SKIPPED' || a.applyState === 'SKIPPED');
  if (_dashTab.q) rows = rows.filter(a => (a.job?.company || a.company || '').toLowerCase().includes(_dashTab.q.toLowerCase()));

  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="4" class="muted" style="padding:24px;text-align:center">No applications here yet.</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.slice(0, 50).map(a => {
    const co = a.job?.company || a.company || 'Unknown';
    const title = a.job?.title || a.title || '';
    return `<tr data-app="${a.id}" style="cursor:pointer">
      <td><div class="co-cell"><div class="co-av">${esc(co[0] || '?')}</div><div class="co-info"><b>${esc(co)}</b><span>${esc(title)}</span></div></div></td>
      <td>${_apResBadge(a)}</td>
      <td>${_apStatusDot(a)}</td>
      <td class="time-col">${ago(a.appliedAt || a.updatedAt || a.createdAt)}</td>
    </tr>`;
  }).join('');
  $$('#appTbody tr[data-app]').forEach(r => r.addEventListener('click', () => openApplication(r.dataset.app)));
}

async function renderJobs() {

  bindRows($('#list'));
  await ensureSkills();
  const draw = feed => {
    $('#searchMeta').innerHTML = searchMetaHTML(feed);
    $('#clearSearch')?.addEventListener('click', () => { state.search = { include: '', exclude: '', scope: state.search.scope }; renderJobs(); });
    $('#titlesOnly')?.addEventListener('click', () => { $('#scope').value = 'title'; $('#searchForm').requestSubmit(); });
    $('#jobsLine').textContent = feed.total ? `${feed.total} jobs, best fit first.` : 'Ranked by how well they fit your profile.';
    $('#list').innerHTML = linkCardHTML() + (feed.jobs.length ? feed.jobs.map(jobCardHTML).join('') + (feed.nextCursor ? `<div class="more" id="sentinel"><span class="muted">Loading more jobs…</span></div>` : '') : zeroHTML(feed));
    watch.disconnect(); if ($('#sentinel')) watch.observe($('#sentinel'));
  };
  // Cards are added as you scroll: 30 first, then 30 more each time the end comes into view.
  let busy = false;
  const watch = new IntersectionObserver(async ([e]) => {
    if (!e.isIntersecting || busy) return; busy = true;
    try {
      const before = state.feed.jobs.length, f = await loadFeed({ append: true, limit: 30 });
      $('#sentinel')?.insertAdjacentHTML('beforebegin', f.jobs.slice(before).map((j, i) => jobCardHTML(j, before + i)).join(''));
      if (!f.nextCursor) { $('#sentinel')?.remove(); watch.disconnect(); }
    } catch (err) { toast(err.message); }
    busy = false;
  }, { rootMargin: '600px' });
  // If we have a cached feed (from a previous visit this session), render it now
  // so the page is instantly populated while the network request completes.
  if (state.feed?.jobs?.length) draw(state.feed);
  draw(await loadFeed({ limit: 30 }));
  const pane = $('#detail');
  if (state.feed.jobs[0] && pane && getComputedStyle(pane).display !== 'none' && !/job=/.test(location.hash)) openJob(state.feed.jobs[0].jobId);
}

async function openTailor(host, data, jobId, btn) {

  sec.innerHTML = `<div class="tailor-box"><h4 style="margin:0 0 6px">Resume for this job</h4>

    <div class="skeleton" style="height:44px;margin-top:12px"></div></div>`;

  finally { btn.disabled = false; btn.textContent = 'Tailor again'; }
}

const APPLY_STATE = {
  QUEUED: ['wait', 'Queued'], PREPARED: ['wait', 'Ready to send'], SUBMITTING: ['wait', 'Sending'], NEEDS_REVIEW: ['review', 'Waiting for your OK'],
  NEEDS_YOU: ['you', 'Needs you'], SUBMITTED: ['sent', 'Sent'], FAILED: ['you', "Couldn't send"], SKIPPED: ['off', 'Skipped'],
};
const _SPIN = '<span style="display:inline-block;width:9px;height:9px;border:1.5px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:3px"></span>';
const applyBadge = st => { const [c, l] = APPLY_STATE[st] || ['off', pretty(st)]; const spin = c === 'wait' ? _SPIN : ''; return `<span class="badge ${c}">${spin}${esc(l)}</span>`; };
function eventText(e) {
  if (e.kind === 'note') return 'Notes edited';
  if (e.kind === 'resume') return `Resume tailored${e.detail?.profile ? ` from "${e.detail.profile}"` : ''}`;
  if (e.kind === 'auto_apply') {
    const l = { QUEUED: 'Picked by auto-apply', PREPARED: e.detail?.approved ? 'Approved, sending on the next run' : 'Resume tailored, ready to send', SUBMITTING: 'Filling the form',
      NEEDS_REVIEW: 'Form filled, waiting for your OK', NEEDS_YOU: 'Stopped: needs you', SUBMITTED: 'Sent', FAILED: "Couldn't send", SKIPPED: 'Skipped' }[e.to] || pretty(e.to);
    return `${l}${e.detail?.reason && ['NEEDS_YOU', 'NEEDS_REVIEW', 'FAILED'].includes(e.to) ? ` — ${e.detail.reason}` : ''}`;
  }
  if (!e.from && e.detail?.source === 'tsenta') return 'Applied through Tsenta';
  if (!e.from) return `Added as ${STATUS_LABEL[e.to] || pretty(e.to)}${e.detail?.source === 'auto' ? ' by auto-apply' : ''}`;
  return `Moved to ${STATUS_LABEL[e.to] || pretty(e.to)}`;
}

/** Resume card: the score, what changed, downloads; the scoring breakdown folds away. */

function atsScanHTML(a) {

    <div class="muted" style="font-size:13px;margin-top:4px">${P.map(([k, l, max]) => `${l} ${a.parts?.[k] ?? '–'}/${max}`).join(' · ')}</div>
