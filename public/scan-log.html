<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface2: #F6F6F5;
    --border: #DEDEDC;
    --accent: #111111;
    --accent2: #2A8057;
    --text: #111111;
    --muted: #6A6A6A;
    --success: #2A8057;
    --warning: #92650A;
    --error: #B84A3E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Schibsted Grotesk', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    padding: 24px 16px;
    max-width: 1200px;
    margin: 0 auto;
  }
  header .controls { margin: 0; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { font-family: 'Big Shoulders Display', sans-serif; font-size: 40px; font-weight: 900; text-transform: uppercase; line-height: 1; }
  header h1 span { color: var(--accent); }
  .meta { color: var(--muted); font-size: 12px; }
  .refresh-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 13px;
  }
  .refresh-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; }
  .card-value { font-size: 24px; font-weight: 700; }
  .card-sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
  h2 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 12px; margin-top: 28px; }
  .ats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-bottom: 8px; }
  .ats-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
  .ats-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .ats-info { flex: 1; min-width: 0; }
  .ats-name { font-weight: 600; text-transform: capitalize; }
  .ats-stats { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .ats-jobs { font-weight: 700; font-size: 18px; }
  .chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 8px; overflow-x: auto; }
  .chart-inner { display: flex; align-items: flex-end; gap: 2px; height: 130px; }
  .bar-group { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 8px; }
  .bar-stack { display: flex; flex-direction: column-reverse; width: 100%; gap: 1px; }
  .bar-seg { width: 100%; min-height: 2px; border-radius: 2px 2px 0 0; }
  .bar-label { font-size: 9px; color: var(--muted); text-align: center; margin-top: 4px; white-space: nowrap; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th { background: var(--surface2); padding: 10px 14px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); white-space: nowrap; }
  td { padding: 10px 14px; border-top: 1px solid var(--border); white-space: nowrap; font-size: 13px; }
  tr:hover td { background: var(--surface2); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; text-transform: capitalize; }
  .badge-completed { background: #F2FAF5; color: var(--success); border: 1px solid #DCF1E5; }
  .badge-running { background: #F4F8FF; color: #3D5FCB; border: 1px solid #DCE7FB; }
  .badge-failed { background: #FFF5F3; color: var(--error); border: 1px solid #FBDCD7; }
  .pos { color: var(--success); font-weight: 600; }
  .neg { color: var(--error); }
  .dim { color: var(--muted); }
  .loading { color: var(--muted); padding: 32px; text-align: center; }
  .err { color: var(--error); padding: 20px; text-align: center; }
  .state { display:inline-block; padding:2px 9px; border-radius:12px; font-size:11px; font-weight:600; }
  .state-running { background:#F2FAF5; color:var(--success); border:1px solid #DCF1E5; }
  .state-waiting { background:#FFFAEB; color:var(--warning); border:1px solid #F7EBC4; }
  .state-idle { background:var(--surface2); color:var(--muted); }
  .pulse { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--success); margin-right:6px; animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  .proc { display:flex; gap:14px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 14px; margin-bottom:8px; flex-wrap:wrap; }
  td.num, th.num { text-align:right; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; align-items:center; }
  .btn { border:1px solid var(--border); background:var(--surface2); color:var(--text); padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:600; }
  .btn:hover { border-color:var(--accent); }
  .btn:disabled { opacity:.45; cursor:wait; }
  .btn-start { background:#F2FAF5; border-color:#DCF1E5; color:var(--success); }
  .btn-stop { background:#FFF5F3; border-color:#FBDCD7; color:var(--error); }
  .btn-sm { padding:3px 10px; font-size:12px; }
  #toast { position:fixed; bottom:20px; right:20px; background:var(--surface2); border:1px solid var(--border); padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; max-width:360px; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Scan <span>Log</span></h1>
    <div class="meta" id="ts">Loading…</div>
  </div>
  <div class="controls">
    <button class="btn btn-start" onclick="ctl('start','scheduled')">▶ Run scan now</button>
    <button class="btn" onclick="ctl('start','bulk')">Start bulk</button>
    <button class="btn btn-stop" onclick="ctl('stop','all')">■ Stop all</button>
    <button class="refresh-btn" onclick="load();loadLive()">↻ Refresh</button>
  </div>
</header>

<div class="cards" id="live-cards"><div class="loading">Loading…</div></div>

<h2>Platforms</h2>
<div class="table-wrap" id="live-platforms"><div class="loading">Loading…</div></div>

<h2>Jobs found per hour · last 48 hours</h2>
<div class="chart-wrap" id="chart-wrap"><div class="loading">Loading…</div></div>

<h2>Recent scan runs</h2>
<div class="table-wrap" id="table-wrap"><div class="loading">Loading…</div></div>

<script>
const COLORS = {
  greenhouse:'#3D5FCB', ashby:'#2A8057', lever:'#92650A', smartrecruiters:'#B84A3E', workday:'#6B4FB3',
  bamboohr:'#4E8F2F', workable:'#B5651D', breezy:'#1F8A8A', teamtailor:'#C2417A', recruitee:'#5B7DB1',
  oraclecloud:'#A33A2A', rippling:'#7A5C2E', pinpoint:'#3E7D5A'
};
const col = n => COLORS[n?.toLowerCase()] || '#6A6A6A';
const fmt = n => (n??0).toLocaleString();
const dur = s => {
  s = Math.round(Number(s||0));
  if (!s) return '—';
  return s < 60 ? s+'s' : Math.floor(s/60)+'m '+s%60+'s';
};
const ago = iso => {
  if (!iso) return '—';
  const d = (Date.now() - new Date(iso)) / 1000;
  if (d < 60) return 'just now';
  if (d < 3600) return Math.floor(d/60)+'m ago';
  if (d < 86400) return Math.floor(d/3600)+'h ago';
  return Math.floor(d/86400)+'d ago';
};
const ft = iso => {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) +
    ' · ' + d.toLocaleDateString([],{month:'short',day:'numeric'});
};

async function load() {
  try {
    const data = await fetch('/api/scan-stats').then(r => {
      if (!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    });
    render(data);
  } catch(e) {
    document.getElementById('table-wrap').innerHTML = `<div class="err">Couldn't load scan runs (${e.message}).</div>`;
  }
}

let lastRuns = [];
function render({runs, byHour}) {
  lastRuns = runs;
  document.getElementById('ts').textContent = 'Updated ' + new Date().toLocaleTimeString();

  // Bar chart
  if (!byHour.length) {
    document.getElementById('chart-wrap').innerHTML = '<div class="loading">No data yet (needs jobs discovered in last 48h).</div>';
  } else {
    const hmap = {}, atsSet = new Set();
    byHour.forEach(r => {
      if (!hmap[r.hour]) hmap[r.hour] = {};
      hmap[r.hour][r.ats] = Number(r.jobs_found);
      atsSet.add(r.ats);
    });
    const hours = Object.keys(hmap).sort();
    const atsArr = [...atsSet];
    const maxV = Math.max(...hours.map(h => Object.values(hmap[h]).reduce((a,b)=>a+b,0)));
    const bars = hours.map(h => {
      const d = new Date(h), label = d.getHours() % 6 ? '' : d.toLocaleTimeString([],{hour:'numeric'});
      const segs  = atsArr.filter(a => hmap[h][a]>0).map(a => {
        const px = Math.max(2, (hmap[h][a]/maxV)*100);
        return `<div class="bar-seg" style="height:${px}px;background:${col(a)}" title="${a}: ${fmt(hmap[h][a])} jobs"></div>`;
      }).join('');
      return `<div class="bar-group"><div class="bar-stack">${segs}</div><div class="bar-label">${label}</div></div>`;
    }).join('');
    const legend = atsArr.map(a =>
      `<div class="legend-item"><div class="legend-dot" style="background:${col(a)}"></div>${a}</div>`
    ).join('');
    document.getElementById('chart-wrap').innerHTML =
      `<div class="chart-inner">${bars}</div>
       <div class="legend">${legend}</div>`;
  }

  // Runs table
  document.getElementById('table-wrap').innerHTML = runs.length ? `
    <table><thead><tr>
      <th>Started</th><th>Duration</th><th>Result</th>
      <th class="num">Companies</th><th class="num">New jobs</th><th class="num">Closed</th><th class="num">Errors</th>
    </tr></thead><tbody>
    ${runs.slice(0, 15).map(r=>`<tr>
      <td>${ft(r.started_at)}</td>
      <td class="dim">${dur(r.elapsed_secs)}</td>
      <td><span class="badge badge-${r.status}">${r.status === 'failed' ? 'stopped early' : r.status}</span></td>
      <td class="num dim">${fmt(r.companies_scanned)}</td>
      <td class="num pos">+${fmt(r.jobs_new)}</td>
      <td class="num ${Number(r.jobs_closed) ? 'neg' : 'dim'}">${fmt(r.jobs_closed)}</td>
      <td class="num ${Number(r.companies_errored)>0?'neg':'dim'}">${fmt(r.companies_errored)}</td>
    </tr>`).join('')}
    </tbody></table>` : '<div class="loading">No runs yet.</div>';
  if (window.lastLive) renderLive(window.lastLive);
}

const left = secs => {
  const a = Math.abs(Math.round(secs)), h = Math.floor(a/3600), m = Math.floor(a%3600/60);
  return h ? h+'h '+m+'m' : m ? m+'m '+(a%60)+'s' : a+'s';
};
const etaTxt = m => m == null ? '—' : m < 60 ? m+'m' : Math.floor(m/60)+'h '+m%60+'m';
let nextAt = null;

function renderLive(d) {
  window.lastLive = d;
  const sc = d.schedule, procs = d.processes;
  nextAt = sc.nextAt ? new Date(sc.nextAt) : null;
  const next = !sc.loaded ? '<span class="neg">not scheduled</span>'
    : sc.runningNow ? '<span class="pos">running now</span>'
    : '<span id="countdown">—</span>';
  const done = lastRuns.find(r => r.status !== 'running');
  document.getElementById('live-cards').innerHTML = `
    <div class="card"><div class="card-label">Active jobs</div><div class="card-value">${d.jobs.countedAt ? fmt(d.jobs.active) : '…'}</div><div class="card-sub">${d.jobs.countedAt ? `${fmt(d.jobs.total)} in database · counted ${ago(d.jobs.countedAt)}` : 'counting, takes a minute'}</div></div>
    <div class="card"><div class="card-label">Next scheduled scan</div><div class="card-value" style="font-size:20px">${next}</div><div class="card-sub">${sc.nextMode === 'full' ? 'full scan (all jobs)' : 'quick scan (new jobs)'} · every ${sc.intervalSecs ? left(sc.intervalSecs) : '—'}<br>last full scan ${sc.lastFull ? ago(sc.lastFull) : 'not yet'}</div></div>
    <div class="card"><div class="card-label">Last finished scan</div><div class="card-value" style="font-size:20px">${done ? (done.status === 'completed' ? '<span class="pos">completed</span>' : '<span class="neg">stopped early</span>') : '—'}</div><div class="card-sub">${done ? ago(done.started_at) + ' · ' + dur(done.elapsed_secs) : ''}</div></div>
    <div class="card"><div class="card-label">Scanning now</div><div class="card-value" style="font-size:20px">${procs.length ? '<span class="pulse"></span>' + procs.length : '<span class="dim">idle</span>'}</div><div class="card-sub">${procs.length ? procs.map(p => `${p.ats} · ${p.source} · ${left(p.elapsedSecs)}`).join('<br>') : (d.bulk.running ? 'bulk running' : 'waiting for next scan')}</div></div>
    <div class="card"><div class="card-label">Ollama</div><div class="card-value" style="font-size:20px">${!d.ollama?.running ? '<span class="neg">not running</span>' : d.ollama.modelInstalled ? '<span class="pos">running</span>' : '<span class="neg">model missing</span>'}</div><div class="card-sub">${d.ollama ? d.ollama.model : '—'}</div></div>`;
  tick();

  const status = p => {
    const live = p.companies - p.dead, pct = live ? p.fresh4h / live : 1;
    if (p.state === 'running' && pct < 1) return '<span class="state state-running">● scanning</span>';
    return pct >= 0.9 ? '<span class="state state-idle">on time</span>' : '<span class="state state-waiting">behind</span>';
  };
  document.getElementById('live-platforms').innerHTML = `
    <table><thead><tr>
      <th>Platform</th><th>Status</th><th class="num">Companies</th><th class="num">Scanned in last 4h</th><th class="num">Never scanned</th>
      <th class="num">Errors</th><th class="num">Active jobs</th><th class="num">New 1h</th><th>Last scan</th><th></th>
    </tr></thead><tbody>
    ${d.platforms.map(p => { const live = p.companies - p.dead, pct = live ? Math.round(100 * p.fresh4h / live) : 100; return `<tr>
      <td style="text-transform:capitalize"><span class="ats-dot" style="display:inline-block;background:${col(p.ats)};margin-right:8px"></span>${p.ats}</td>
      <td>${status(p)}</td>
      <td class="num dim">${fmt(live)}</td>
      <td class="num"><span style="display:inline-block;width:60px;height:6px;border-radius:3px;background:var(--surface2);vertical-align:middle;margin-right:8px;overflow:hidden"><i style="display:block;height:100%;width:${pct}%;background:${pct >= 90 ? 'var(--success)' : 'var(--warning)'}"></i></span>${pct}%</td>
      <td class="num ${p.waiting ? '' : 'dim'}" style="${p.waiting ? 'color:var(--warning)' : ''}">${fmt(p.waiting)}</td>
      <td class="num ${p.erroring ? 'neg' : 'dim'}">${fmt(p.erroring)}</td>
      <td class="num">${d.jobs.countedAt ? fmt(p.activeJobs) : '…'}</td><td class="num pos">${p.new1h ? '+' + fmt(p.new1h) : '<span class="dim">0</span>'}</td>
      <td class="dim">${ago(p.lastScan)}</td>
      <td>${p.state === 'running'
        ? `<button class="btn btn-sm btn-stop" onclick="ctl('stop','${p.ats}')">Stop</button>`
        : `<button class="btn btn-sm" onclick="ctl('start','${p.ats}')">Scan</button>`}</td></tr>`; }).join('')}
    </tbody></table>`;
}

function tick() {
  const el = document.getElementById('countdown');
  if (!el || !nextAt) return;
  const s = (nextAt - Date.now()) / 1000;
  el.textContent = s > 0 ? 'in ' + left(s) : 'due now (' + left(-s) + ' late)';
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 4000);
}

async function ctl(action, target) {
  if (action === 'stop' && target === 'all' && !confirm('Stop every running scan?')) return;
  const btns = document.querySelectorAll('.btn'); btns.forEach(b => b.disabled = true);
  try {
    const r = await fetch('/api/scan-control', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, target }) });
    toast((await r.json()).message || 'Done');
  } catch (e) { toast('Failed: ' + e.message); }
  // a freshly spawned scan needs a moment to show up in the process list
  setTimeout(() => { btns.forEach(b => b.disabled = false); loadLive(); load(); }, 2500);
}

async function loadLive() {
  try { renderLive(await fetch('/api/scan-status').then(r => { if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })); }
  catch (e) { document.getElementById('live-platforms').innerHTML = `<div class="err">Couldn't load platform status (${e.message}). The database may be busy with a scan; it retries every 10 seconds.</div>`; }
}

load(); loadLive();
setInterval(load, 30000);
setInterval(loadLive, 10000);
setInterval(tick, 1000);
</script>
<div id="toast"></div>
</body>
</html>
